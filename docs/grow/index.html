<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GROW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one full-bleed night-soil stage; title top-left, choice cards rise from the bottom, system feedback pinned bottom. Deliberately single dark theme. */
:root {
  --night: #10130f;
  --soil: #2b251d;
  --paper: #e8e3d4;
  --muted: #8b917c;
  --panel: #191d16;
  --line: #343a2d;
  --leaf: #6f9a52;
  --warm: #e38a5c;
  --cool: #93b4c6;
  --f-display: "Syne", "Arial Black", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* Background aura: a few soft pools of the game's own colours drifting very slowly behind the canvas */
.aura { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.aura i {
  position: absolute; width: 70vmax; height: 70vmax; left: 50%; top: 50%;
  margin: -35vmax 0 0 -35vmax; border-radius: 50%;
  animation: drift 60s ease-in-out infinite alternate;
  will-change: transform;
}
.aura i:nth-child(1) { background: radial-gradient(closest-side, rgba(111,154,82,0.13) 0%, rgba(111,154,82,0.081) 30%, rgba(111,154,82,0.036) 58%, rgba(111,154,82,0.010) 82%, rgba(111,154,82,0) 100%); --a: -30vw, -16vh; --b: 6vw, 12vh; animation-duration: 64s; }
.aura i:nth-child(2) { background: radial-gradient(closest-side, rgba(147,180,198,0.1) 0%, rgba(147,180,198,0.062) 30%, rgba(147,180,198,0.028) 58%, rgba(147,180,198,0.008) 82%, rgba(147,180,198,0) 100%); --a: 30vw, -20vh; --b: -4vw, 18vh; animation-duration: 78s; animation-delay: -20s; }
.aura i:nth-child(3) { background: radial-gradient(closest-side, rgba(227,138,92,0.07) 0%, rgba(227,138,92,0.043) 30%, rgba(227,138,92,0.020) 58%, rgba(227,138,92,0.006) 82%, rgba(227,138,92,0) 100%); --a: 22vw, 26vh; --b: -30vw, 2vh; animation-duration: 92s; animation-delay: -45s; }
.aura i:nth-child(4) { background: radial-gradient(closest-side, rgba(154,111,168,0.07) 0%, rgba(154,111,168,0.043) 30%, rgba(154,111,168,0.020) 58%, rgba(154,111,168,0.006) 82%, rgba(154,111,168,0) 100%); --a: -24vw, 24vh; --b: 26vw, -12vh; animation-duration: 84s; animation-delay: -10s; }
@keyframes drift {
  from { transform: translate(var(--a)) scale(1); }
  to   { transform: translate(var(--b)) scale(1.12); }
}
#stage:focus-visible { box-shadow: inset 0 0 0 2px var(--cool); }

.head {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 0; right: 0;
  padding-inline: max(16px, 4vw); pointer-events: none;
  display: flex; flex-direction: column; gap: 6px;
}
.head h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.6rem); letter-spacing: 0.22em; line-height: 1; }
.head p { margin: 0; color: var(--muted); font-size: 0.95rem; letter-spacing: 0.02em; }

.foot {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-inline: max(16px, 4vw);
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px;
  pointer-events: none;
}
.left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.status { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.04em; color: var(--muted); min-height: 1.2em; }
.status b { color: var(--paper); font-weight: 400; }
.path { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.path i { font-style: normal; color: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.path s { text-decoration: none; opacity: .5; }
.rhythm { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.rhythm span { font-family: var(--f-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
.rhythm canvas { width: 220px; height: 26px; max-width: 100%; display: block; }

/* Choice step */
.choice {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  transform: translate(-50%, 12px); opacity: 0;
  width: min(560px, calc(100% - 32px));
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  transition: opacity .45s ease, transform .45s ease;
  backdrop-filter: blur(6px);
}
.choice.show { opacity: 1; transform: translate(-50%, 0); }
.choice .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.choice .step { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.choice .dots { display: flex; gap: 5px; }
.choice .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.choice .dots span.on { background: var(--paper); }
.choice h3 { margin: 0; font-weight: 500; font-size: 1.05rem; text-wrap: balance; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt {
  font: inherit; color: var(--paper); text-align: left; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  transition: border-color .2s, background .2s, transform .2s;
}
.opt:hover { border-color: var(--muted); background: color-mix(in srgb, var(--paper) 4%, transparent); transform: translateY(-2px); }
.opt:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
.opt .sw { width: 18px; height: 18px; border-radius: 50%; margin-bottom: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.opt b { font-weight: 700; font-size: 0.98rem; }
.opt b em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 0.76rem; margin-left: 4px; font-family: var(--f-mono); }
.opt small { color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
@media (max-width: 480px) {
  .opts { grid-template-columns: 1fr; }
  .opt { flex-direction: row; align-items: center; gap: 10px; }
  .opt .sw { margin: 0; flex: none; }
  .opt small { margin-left: auto; text-align: right; }
  .rhythm { align-items: flex-start; }
}

.final {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
  padding-inline: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  pointer-events: none; opacity: 0; transform: translateY(6px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}
.final.show { opacity: 1; transform: none; }
.final h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.15rem, 3vw, 1.5rem); letter-spacing: 0.04em; text-wrap: balance; }
.final .kind { font-size: 1.05rem; font-weight: 500; }
.final .kind span { color: var(--muted); font-family: var(--f-mono); font-size: 0.75rem; margin-left: 6px; }
.final p { margin: 0; color: var(--muted); max-width: 48ch; line-height: 1.55; text-wrap: balance; }
.final button {
  pointer-events: auto; margin-top: 6px; font: 500 0.82rem var(--f-body); letter-spacing: 0.06em; color: var(--paper);
  background: transparent; border: 1px solid color-mix(in srgb, var(--paper) 35%, transparent); border-radius: 999px; padding: 8px 18px; cursor: pointer;
}
.final button:hover { border-color: var(--paper); }
.final button:focus-visible { outline: 2px solid var(--cool); outline-offset: 3px; }
.final[aria-hidden="true"] button { pointer-events: none; }
.final-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.final button.primary { background: var(--paper); color: var(--night); border-color: var(--paper); }
.final button.primary:hover { background: transparent; color: var(--paper); }
.final button.primary:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: default; }

/* Tutorial */
.tut-start {
  pointer-events: auto; align-self: flex-start; margin-top: 8px;
  font: 500 0.82rem var(--f-body); color: var(--night); background: var(--paper);
  border: 1px solid var(--paper); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.tut-start:hover { background: transparent; color: var(--paper); }
.tut-start:focus-visible, .tut-exit:focus-visible, .tut-next:focus-visible, .tut-ghost:focus-visible { outline: 2px solid var(--cool); outline-offset: 3px; }
.tut {
  position: fixed; z-index: 5;
  left: max(16px, 4vw); top: calc(env(safe-area-inset-top, 0px) + 140px);
  width: 330px; max-height: calc(100% - 200px); overflow-y: auto;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  backdrop-filter: blur(6px);
}
.tut-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tut-step { font: 0.7rem var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tut-exit { font: 0.75rem var(--f-body); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
.tut-exit:hover { color: var(--paper); }
.tut-bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.tut-bar b { display: block; height: 100%; background: var(--paper); transition: width .4s ease; }
.tut h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.03em; }
.tut .lbl { font: 0.66rem var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tut-do { display: flex; flex-direction: column; gap: 6px; }
.tut-do p#tutDo { margin: 0; font-size: 1rem; line-height: 1.45; font-weight: 500; }
.tut-count { display: flex; gap: 6px; }
.tut-count span { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, border-color .2s; }
.tut-count span.on { background: var(--cool); border-color: var(--cool); }
.tut-count span.fast.on { background: var(--warm); border-color: var(--warm); }
.tut-meter { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.tut-meter b { display: block; height: 100%; width: 0; background: var(--cool); }
.tut-live { margin: 0; min-height: 1.3em; font: 0.78rem var(--f-mono); color: var(--muted); line-height: 1.45; }
.tut-live b { color: var(--paper); font-weight: 400; }
.tut-fx { display: flex; flex-direction: column; gap: 6px; }
.fx-row { border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.fx-row p { margin: 0; line-height: 1.45; font-size: 0.9rem; }
.fx-row.cause { border: 1px solid var(--line); }
.fx-row.effect { background: color-mix(in srgb, var(--leaf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--leaf) 45%, transparent); }
.fx-row.effect .lbl { color: var(--leaf); }
.fx-arrow { height: 14px; display: flex; justify-content: center; }
.fx-arrow::before { content: ""; width: 1px; height: 100%; background: var(--muted); }
.tut-next, .tut-ghost { font: 500 0.85rem var(--f-body); border-radius: 999px; padding: 9px 18px; cursor: pointer; align-self: flex-start; }
.tut-next { margin-top: 6px; color: var(--night); background: var(--paper); border: 1px solid var(--paper); }
.tut-next:hover { background: transparent; color: var(--paper); }
.tut-ghost { color: var(--paper); background: transparent; border: 1px solid var(--line); }
.tut-ghost:hover { border-color: var(--muted); }
.tut-fxline { margin: 0; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.45;
  background: color-mix(in srgb, var(--leaf) 16%, transparent); border: 1px solid color-mix(in srgb, var(--leaf) 40%, transparent); }
.tut-fxline::before { content: "What happened  "; font: 0.64rem var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--leaf); display: block; margin-bottom: 2px; }
.tut-hint { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
.tut-end { display: flex; flex-direction: column; gap: 10px; }
.tut-end p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 0.9rem; }
.tut-end-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tut-end-actions .tut-next { margin-top: 0; }
body.tut-on .status, body.tut-on #again { display: none; }
@media (max-width: 859px) {
  .tut { left: 16px; right: 16px; width: auto; top: calc(env(safe-area-inset-top, 0px) + 96px); max-height: 38%; padding: 12px 14px; gap: 8px; }
  .tut h3 { font-size: 1.05rem; }
  body.tut-on .head p { display: none; }
}

/* Archive */
.archive-btn {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 30px); right: max(16px, 4vw);
  font: 500 0.8rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--paper); background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center;
  transition: border-color .2s, transform .3s;
}
.archive-btn span { color: var(--muted); font-variant-numeric: tabular-nums; }
.archive-btn:hover { border-color: var(--muted); }
.archive-btn:focus-visible, .close:focus-visible { outline: 2px solid var(--cool); outline-offset: 3px; }
.archive-btn.bump { transform: scale(1.12); border-color: var(--paper); }
.archive {
  position: fixed; inset: 0; z-index: 10;
  background: color-mix(in srgb, var(--night) 94%, transparent);
  backdrop-filter: blur(8px);
  overflow-y: auto; overscroll-behavior: contain;
  padding-inline: max(16px, 4vw);
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}
.archive-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.archive-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.archive-titles { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.archive h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: 0.16em; text-transform: uppercase; }
.archive-titles p { margin: 0; color: var(--muted); max-width: 52ch; line-height: 1.5; }
.close { font: 500 0.82rem var(--f-body); color: var(--paper); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; flex: none; }
.close:hover { border-color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 0.7rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, #8a6b48 calc(var(--d) * 100%), var(--leaf)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: var(--panel); display: flex; flex-direction: column; min-width: 0;
}
.card canvas { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; background: radial-gradient(circle at 50% 42%, #1d2219 0%, #141711 70%); }
.card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h3 { margin: 0; font-size: 1rem; font-weight: 500; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chip { font: 0.68rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--paper); white-space: nowrap; }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; background: color-mix(in srgb, #8a6b48 calc(var(--d) * 100%), var(--leaf)); }
.decay { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.decay b { display: block; height: 100%; background: color-mix(in srgb, #8a6b48 calc(var(--d) * 100%), var(--leaf)); width: calc(var(--d) * 100%); }
.card time, .card .age { font: 0.72rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card .path { font: 0.72rem var(--f-mono); color: var(--paper); opacity: .8; line-height: 1.5; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
.empty { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); line-height: 1.6; }
.empty b { color: var(--paper); font-weight: 500; display: block; margin-bottom: 4px; }
.archive-note { margin: 0; color: var(--muted); font: 0.72rem var(--f-mono); letter-spacing: 0.04em; }
@media (max-width: 480px) { .archive-btn { top: calc(env(safe-area-inset-top, 0px) + 34px); } }
body.done .foot .left { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .choice, .final, .opt { transition: none; } .aura i { animation: none; transform: translate(var(--a)); } }
</style>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<canvas id="stage" tabindex="0" aria-label="A seed. Drag it into the soil, or press Space to drop it."></canvas>

<header class="head">
  <h1>GROW</h1>
  <p>Take care of it.</p>
  <button class="tut-start" id="startTut" type="button">New here? Follow the tutorial</button>
</header>

<aside class="tut" id="tut" hidden aria-live="polite" aria-labelledby="tutTitle">
  <div class="tut-top">
    <span class="tut-step" id="tutStep"></span>
    <button class="tut-exit" id="tutExit" type="button">Exit tutorial</button>
  </div>
  <div class="tut-bar" aria-hidden="true"><b id="tutBar"></b></div>
  <p class="tut-fxline" id="tutFxLine" hidden></p>
  <h3 id="tutTitle"></h3>
  <p class="tut-hint" id="tutHint"></p>
  <div class="tut-end" id="tutEnd" hidden>
    <div class="tut-end-actions">
      <button id="tutFree" class="tut-next" type="button">Grow freely</button>
      <button id="tutArchive" class="tut-ghost" type="button">Open archive</button>
    </div>
  </div>
</aside>

<button class="archive-btn" id="openArchive" type="button" aria-haspopup="dialog">Archive <span id="archiveCount">0</span></button>

<section class="archive" id="archive" role="dialog" aria-modal="true" aria-labelledby="archiveTitle" hidden>
  <div class="archive-inner">
    <div class="archive-head">
      <div class="archive-titles">
        <h2 id="archiveTitle">Archive</h2>
        <p id="archiveSub">Flowers you picked. They keep decaying while they wait here.</p>
      </div>
      <button class="close" id="closeArchive" type="button" aria-label="Close archive">Close</button>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i style="--d:0"></i>Fresh</span><span><i style="--d:.35"></i>Wilting</span><span><i style="--d:.65"></i>Withered</span><span><i style="--d:.95"></i>Decayed</span>
    </div>
    <div class="grid" id="archiveGrid"></div>
    <p class="archive-note" id="archiveNote"></p>
  </div>
</section>

<section class="choice" id="choice" hidden aria-live="polite">
  <div class="meta"><span class="step" id="stepLabel"></span><div class="dots" id="dots"></div></div>
  <h3 id="question"></h3>
  <div class="opts" id="opts"></div>
</section>

<div class="final" id="final" aria-hidden="true" aria-live="polite">
  <h2>Your plant grew this way.</h2>
  <div class="kind" id="kind"></div>
  <p id="finalNote"></p>
  <div class="final-actions">
    <button id="keep" type="button" class="primary">Add to archive</button>
    <button id="again" type="button">Plant again</button>
  </div>
</div>

<footer class="foot">
  <div class="left">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="path" id="path"></div>
  </div>
  <div class="rhythm">
    <span>Your rhythm</span>
    <canvas id="rhythm" aria-hidden="true"></canvas>
  </div>
</footer>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const rc = document.getElementById('rhythm');
  const rctx = rc.getContext('2d');
  const $ = id => document.getElementById(id);
  const statusEl = $('status'), pathEl = $('path'), finalEl = $('final'), choiceEl = $('choice');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RM = reduce ? 0.3 : 1;

  const css = getComputedStyle(document.documentElement);
  const C = {};
  ['soil', 'paper', 'muted', 'warm', 'cool'].forEach(n => C[n] = css.getPropertyValue('--' + n).trim());

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = g => 1 - Math.pow(1 - clamp(g, 0, 1), 3);
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const FAST = 320, SLOW = 800, FLOWER_AT = 18, REST_AFTER = 2500, BUD_IDLE = 10000, STYLE_IDLE = 13000;

  // ---------- Feel: springs and rubber banding (from the Seed to Flower prototype) ----------
  function spring(x, k, c) { return { x, v: 0, t: x, k, c }; }
  function stepSpring(sp, dt) { const a = sp.k * (sp.t - sp.x) - sp.c * sp.v; sp.v += a * dt; sp.x += sp.v * dt; }
  function tune(sp, kk, c) { sp.k = kk; sp.c = reduce ? Math.max(c, 2 * Math.sqrt(kk)) : c; }
  const rubber = (d, lim) => lim * (1 - Math.exp(-Math.max(0, d) / lim));
  function freshTug() {
    return { phase: 'rest', D: [0, 0], Dv: [0, 0], sK: 280, sC: 15, id: null, kb: false,
             grabStart: [0, 0], Gbase: [0, 0], lastP: [0, 0], t: 0, jx: 0, jy: 0 };
  }

  // ---------- Sound (synthesized with Web Audio; starts on the first gesture) ----------
  const Sound = (() => {
    let ctx = null, master = null, white = null, brown = null, bed = null;
    let grainAcc = 0, lastT = 0;
    const rnd = (a, b) => a + Math.random() * (b - a);

    function makeNoise(sec, kind) {
      const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * sec), ctx.sampleRate);
      const d = b.getChannelData(0);
      let last = 0;
      for (let i = 0; i < d.length; i++) {
        const w = Math.random() * 2 - 1;
        if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else d[i] = w;
      }
      return b;
    }
    function out(pan) {
      if (ctx.createStereoPanner && pan) {
        const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(master); return p;
      }
      return master;
    }
    // One short filtered noise burst: the building block of every texture
    function burst({ when = 0, dur = 0.02, freq = 2000, q = 1, peak = 0.1, attack = 0.002, pan = 0, type = 'bandpass', buf = white, sweepTo = 0 }) {
      const t = ctx.currentTime + when;
      const s = ctx.createBufferSource(); s.buffer = buf;
      const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q;
      fl.frequency.setValueAtTime(freq, t);
      if (sweepTo) fl.frequency.exponentialRampToValueAtTime(sweepTo, t + attack + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
      s.connect(fl); fl.connect(g); g.connect(out(pan));
      s.start(t, rnd(0, buf.duration - attack - dur - 0.1), attack + dur + 0.05);
    }

    function init() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
        ctx = new AC();
        master = ctx.createGain();
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp); comp.connect(ctx.destination);
        white = makeNoise(3, 'white');
        brown = makeNoise(4, 'brown');

        // Continuous bed while growing: a soft fibrous swish
        const s = ctx.createBufferSource(); s.buffer = white; s.loop = true;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
        const g = ctx.createGain(); g.gain.value = 0;
        s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
        s.start();
        bed = { bp, g };
        lastT = ctx.currentTime;
      } catch (_) { ctx = null; }
    }

    // Seed landing in soil: a dull thud plus a little grit, scaled by impact speed (new for this sequence)
    function thud(strength) {
      if (!ctx) return;
      const s = clamp(strength, 0, 1);
      burst({ dur: 0.06 + 0.05 * s, freq: 170 + 110 * s, type: 'lowpass', q: 0.7, peak: 0.04 + 0.3 * s, attack: 0.003, buf: brown });
      const n = 2 + Math.round(4 * s);
      for (let i = 0; i < n; i++) {
        burst({ when: rnd(0, 0.05), dur: rnd(0.004, 0.012), freq: rnd(2200, 5000), q: rnd(1.5, 3),
                peak: 0.01 + rnd(0.015, 0.05) * s, pan: rnd(-0.25, 0.25) });
      }
    }
    // Stem stretching: soft swish plus tiny fiber creaks whose density follows drag speed and tension
    function stretch(q, tension, speed) {
      if (!bed) return;
      const now = ctx.currentTime;
      const dt = Math.min(0.1, now - lastT); lastT = now;
      bed.bp.frequency.setTargetAtTime(500 + 700 * q + tension * 12, now, 0.08);
      bed.g.gain.setTargetAtTime(0.045 * speed, now, speed > 0.02 ? 0.05 : 0.15);
      grainAcc += speed * (22 + tension * 3) * dt;
      while (grainAcc >= 1) {
        grainAcc -= 1;
        burst({
          when: rnd(0, 0.03), dur: rnd(0.004, 0.014),
          freq: rnd(1100, 2600) + tension * 40, q: rnd(1.5, 4),
          peak: rnd(0.03, 0.11) * (0.5 + 0.5 * speed), pan: rnd(-0.2, 0.2)
        });
      }
    }
    // Leaf unfolding: a cluster of dry leaf rustles
    function rustle(pan = 0, when = 0, scale = 1) {
      if (!ctx) return;
      const n = 7 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        burst({
          when: when + rnd(0, 0.32), dur: rnd(0.025, 0.08), freq: rnd(2500, 6000),
          q: rnd(0.7, 1.6), peak: rnd(0.04, 0.1) * scale, attack: 0.004, pan: pan + rnd(-0.15, 0.15)
        });
      }
      burst({ when, dur: 0.28, freq: 3200, q: 0.5, peak: 0.035 * scale, attack: 0.06, pan });
    }
    // Bud appearing: a soft muffled split, like a pod giving way
    function pop() {
      if (!ctx) return;
      burst({ dur: 0.09, freq: 320, type: 'lowpass', q: 0.8, peak: 0.4, attack: 0.003, buf: brown });
      burst({ when: 0.004, dur: 0.007, freq: 3200, type: 'highpass', q: 0.7, peak: 0.1 });
      burst({ when: 0.02, dur: 0.012, freq: 1800, q: 2, peak: 0.05 });
    }
    // Each petal unfurling: a silky, rising brush
    function petal(i) {
      if (!ctx) return;
      const pan = (i - 2.5) * 0.12;
      burst({ dur: 0.32, freq: 1800, sweepTo: 4800, q: 0.9, peak: 0.03, attack: 0.09, pan });
      burst({ when: rnd(0.04, 0.15), dur: 0.01, freq: rnd(3000, 5000), q: 2, peak: 0.03, pan });
    }
    // Full bloom: a gentle breeze swells through and the leaves stir
    function bloom() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = brown; s.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
      lp.frequency.setValueAtTime(260, t);
      lp.frequency.linearRampToValueAtTime(900, t + 1.1);
      lp.frequency.linearRampToValueAtTime(320, t + 3);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 1.0);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      s.connect(lp); lp.connect(g); g.connect(master);
      s.start(t); s.stop(t + 3.3);
      rustle(-0.35, 0.5, 0.8);
      rustle(0.35, 0.95, 0.7);
      rustle(0, 1.5, 0.45);
    }
    // Stem snapping: one hollow pop, like a cork pulled out (Pick a Flower)
    function snap() {
      if (!ctx) return;
      try {
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(240, t);
        o.frequency.exponentialRampToValueAtTime(680, t + 0.03);
        o.frequency.exponentialRampToValueAtTime(520, t + 0.09);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.6, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.13);
      } catch (_) {}
    }
    return { init, thud, stretch, rustle, pop, petal, bloom, snap };
  })();

  // ---------- The five choice steps ----------
  // at: growth-click count when the step appears ('seed' = right after the seed is clicked)
  // t: trait points used for the final plant type (lush / hardy / lunar / wild)
  const STEPS = [
    { key: 'soil', at: 'seed', en: 'Soil', q: 'What soil will you plant it in?', opts: [
      { id: 'clay', en: 'Clay', hint: 'Deep roots, thick stem', sw: '#7a5a3c', t: { hardy: 2 } },
      { id: 'sand', en: 'Sand', hint: 'Thin stem, narrow pointed leaves', sw: '#c9a86a', t: { hardy: 1, wild: 1 } },
      { id: 'humus', en: 'Humus', hint: 'More and bigger leaves', sw: '#3d2f22', t: { lush: 2 } } ] },
    { key: 'water', at: 2, en: 'Water', q: 'It needs water. How will you give it?', opts: [
      { id: 'mist', en: 'Mist', hint: 'Small leaves that fold upward', sw: '#b8c9cf', t: { hardy: 1, lunar: 1 } },
      { id: 'steady', en: 'Steady', hint: 'Even, upright growth', sw: '#5f8fa8', t: { lush: 1 } },
      { id: 'flood', en: 'Downpour', hint: 'Drooping leaves with water drops', sw: '#2f5878', t: { wild: 2 } } ] },
    { key: 'light', at: 6, en: 'Light', q: 'Which light should it turn toward?', opts: [
      { id: 'sun', en: 'Sun', hint: 'Bright and standing tall', sw: '#f0c26a', t: { lush: 1, hardy: 1 } },
      { id: 'moon', en: 'Moon', hint: 'Paler colors with a soft glow', sw: '#c9d3e6', t: { lunar: 2 } },
      { id: 'shade', en: 'Shade', hint: 'Leans sideways looking for light', sw: '#3f4a3a', t: { wild: 1, lunar: 1 } } ] },
    { key: 'friend', at: 10, en: 'Companion', q: 'Who will keep it company?', opts: [
      { id: 'bee', en: 'Bee', hint: 'More petals, more pollen', sw: '#e8b63c', t: { lush: 2 } },
      { id: 'vine', en: 'Vine', hint: 'Tendrils wrap around the stem', sw: '#7fa44a', t: { wild: 2 } },
      { id: 'fungus', en: 'Fungus', hint: 'Mushrooms at the base, purple flower center', sw: '#9a6fa8', t: { lunar: 1, hardy: 1 } } ] },
    { key: 'climate', at: 14, en: 'Climate', q: 'Before it blooms, the weather changes.', opts: [
      { id: 'wind', en: 'Wind', hint: 'Bent stem, petals blow away', sw: '#a7b0a0', t: { wild: 2 } },
      { id: 'frost', en: 'Frost', hint: 'Ice crystals and cooler colors', sw: '#a9d6ee', t: { lunar: 1, hardy: 1 } },
      { id: 'warmth', en: 'Warmth', hint: 'A bigger, brighter flower', sw: '#ea8a5a', t: { lush: 2 } } ] },
  ];

  let TUT = null; // tutorial state; null = free mode
  const TUT_WIDE = 860;
  let W, H, dpr, baseX, baseY, availH, U, k;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // in the tutorial the guide card sits on the left (wide) or on top (narrow)
    baseX = TUT && W >= TUT_WIDE ? 380 + (W - 380) / 2 : W / 2;
    baseY = H * (W < 520 ? 0.60 : 0.66);
    if (TUT && W < TUT_WIDE) baseY = H * 0.72;
    availH = baseY - (TUT && W < TUT_WIDE ? Math.max(260, H * 0.44) : Math.max(150, H * 0.2));
    U = availH / 14;
    k = clamp(availH / 400, 0.6, 1.4);
    const rw = Math.min(220, W - 32);
    rc.style.width = rw + 'px'; rc.width = rw * dpr; rc.height = 26 * dpr;
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function freshMods() {
    return {
      stemW: 1, segLen: 1, leafSize: 1, leafUp: 0, leafWr: 1, leafKeep: 1, leafExtra: 0,
      lean: 0, correct: 1, tendril: 0, wind: 0, bloom: 1, petalsExtra: 0,
      tint: { h: 0, s: 1, l: 0 }, stemHue: 0,
      drops: false, frost: false, moon: false, sun: false, shade: false, bee: false, fungus: false, vine: false, warmth: false,
    };
  }

  let S;
  function reset() {
    S = {
      stage: 'seed', growth: 0, fast: 0, slow: 0, mid: 0,
      segs: [], branches: [], leaves: [], roots: [], marks: [], parts: [], shrooms: [],
      shake: 0, crack: 0, lastClick: 0, germAt: 0, afterChoice: false,
      kick: 0, breath: 0, scale: 1, side: 1, dim: 0, pick: null, matureAt: 0,
      flower: null, pts: [], step: 0, picks: {}, traits: { lush: 0, hardy: 0, lunar: 0, wild: 0 },
      M: freshMods(), tint: { h: 0, s: 1, l: 0 }, sky: { sun: 0, moon: 0, shade: 0 },
      mouse: { x: -9999, y: -9999, on: false }, statusKey: '', lastPetal: 0,
      sd: { mode: 'air', x: 0, y: 0, vx: 0, vy: 0, hs: 1, sq: 0, sqV: 0, bounce: 0, failT: 0 }, auto: null, autoDone: null, rushAt: 0,
      // interaction feel carried over from the Seed to Flower prototype
      st: null,                                            // stretch-to-grow drag
      pull: spring(0, 200, 19), bend: spring(0, 200, 19),  // rubber-band stretch and sideways lean of the stem
      tug: freshTug(), burst: null, fh: 1,                 // pull-to-pick
      lastT: 0, tipBase: null, guide: 0,
    };
    finalEl.classList.remove('show'); finalEl.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('done');
    const keep = $('keep'); keep.disabled = false; keep.textContent = 'Add to archive';
    hideChoice();
    renderPath();
    cv.setAttribute('aria-label', 'A seed. Drag it into the soil, or press Space to drop it.');
  }

  function setStatus(key, html) {
    if (S.statusKey === key) return;
    S.statusKey = key; statusEl.innerHTML = html;
  }

  function renderPath() {
    if (!S.step) { pathEl.innerHTML = ''; return; }
    pathEl.innerHTML = '<span>Path</span>' + STEPS.slice(0, S.step).map(st => {
      const o = st.opts.find(o => o.id === S.picks[st.key]);
      return `<i>${o.en}</i>`;
    }).join('<s>→</s>');
  }

  // ---------- Choice panel ----------
  function openChoice(now) {
    const st = STEPS[S.step];
    S.prevStage = S.stage; S.stage = 'choosing';
    $('stepLabel').textContent = `Step ${S.step + 1} / ${STEPS.length} · ${st.en}`;
    $('dots').innerHTML = STEPS.map((_, i) => `<span class="${i <= S.step ? 'on' : ''}"></span>`).join('');
    $('question').textContent = st.q;
    $('opts').innerHTML = st.opts.map(o =>
      `<button class="opt" type="button" data-id="${o.id}"><span class="sw" style="background:${o.sw}"></span><b>${o.en}</b><small>${o.hint}</small></button>`).join('');
    choiceEl.hidden = false;
    requestAnimationFrame(() => choiceEl.classList.add('show'));
    setStatus('choose' + S.step, 'Growth paused. <b>Make a choice.</b>');
    setTimeout(() => { const b = choiceEl.querySelector('.opt'); if (b && S.stage === 'choosing') b.focus({ preventScroll: true }); }, 60);
  }
  function hideChoice() { choiceEl.classList.remove('show'); choiceEl.hidden = true; }

  $('opts').addEventListener('click', e => {
    const btn = e.target.closest('.opt');
    if (!btn || S.stage !== 'choosing') return;
    const now = performance.now();
    const st = STEPS[S.step];
    const o = st.opts.find(x => x.id === btn.dataset.id);
    S.picks[st.key] = o.id;
    Object.entries(o.t).forEach(([t, v]) => S.traits[t] += v);
    applyChoice(o.id);
    S.step++;
    renderPath();
    hideChoice();
    S.kick = 1;
    if (st.key === 'soil') germinate(now);
    else { S.stage = 'growing'; S.lastClick = now; S.afterChoice = true; S.statusKey = ''; setStatus('picked', `${o.en}. <b>Stretch the plant upward</b> to let it grow.`); }
    cv.focus({ preventScroll: true });
    if (TUT) tutChoice(st, o);
  });

  function applyChoice(id) {
    const M = S.M;
    switch (id) {
      case 'clay': M.stemW = 1.45; M.segLen = 0.9; M.stemHue = -18; break;
      case 'sand': M.stemW = 0.7; M.leafWr = 0.55; M.leafKeep = 0.65; break;
      case 'humus': M.leafSize = 1.18; M.leafExtra = 0.45; break;
      case 'mist': M.leafSize *= 0.8; M.leafUp = -0.35; break;
      case 'steady': M.correct = 1.4; break;
      case 'flood': M.leafUp = 0.65; M.drops = true; M.tint.h += 22; M.tint.s *= 0.8;
        S.leaves.forEach(l => l.off += 0.5); for (let i = 0; i < 3; i++) addRoot(0.5); break;
      case 'sun': M.sun = true; M.correct *= 1.3; M.tint.l += 6; M.tint.s *= 1.1; break;
      case 'moon': M.moon = true; M.tint.s *= 0.45; M.tint.l += 14;
        for (let i = 0; i < 9; i++) S.parts.push({ type: 'fly', x: baseX + rand(-140, 140) * k, y: baseY - rand(20, availH), ph: rand(0, 6), sp: rand(0.4, 1) });
        break;
      case 'shade': M.shade = true; M.lean = 0.07; M.segLen *= 1.25; M.leafSize *= 0.85; M.tint.l -= 7; break;
      case 'bee': M.bee = true; M.petalsExtra = 3; break;
      case 'vine': M.vine = true; M.tendril = 0.5;
        for (let i = 0; i < 3; i++) S.leaves.push(makeTendril(Math.floor(rand(0, S.segs.length))));
        break;
      case 'fungus': M.fungus = true;
        for (let i = 0; i < 4; i++) S.shrooms.push({ x: rand(-70, 70) * k, s: rand(0.6, 1.2) * k, g: 0, d: i * 0.25, h: rand(270, 300) });
        break;
      case 'wind': M.wind = 0.035; break;
      case 'frost': M.frost = true; M.tint.h += 40; M.tint.s *= 0.6; M.tint.l += 8; M.bloom = 0.85; break;
      case 'warmth': M.warmth = true; M.bloom = 1.22; M.tint.s *= 1.15; break;
    }
  }

  // ---------- Growth ----------
  function addRoot(wiggle) {
    const soil = S.picks.soil;
    const deep = soil === 'clay' ? 1.5 : soil === 'sand' ? 1.9 : soil === 'humus' ? 0.75 : 1;
    S.roots.push({ a: rand(-1.15, 1.15), len: rand(14, 34) * k * deep * (1 + S.roots.length * 0.08), g: 0, w: wiggle, ph: rand(0, 6) });
  }
  const cumAngle = () => S.segs.reduce((s, g) => s + g.dA, 0);
  function makeTendril(seg) {
    return { br: null, seg: Math.max(0, seg), f: rand(0.3, 0.95), side: Math.random() < 0.5 ? -1 : 1, off: 0, size: rand(10, 18) * k, base: 0, g: 0, kind: 'curl', turn: 0, seed: Math.random() };
  }
  function makeLeaf(seg, f, side, off, size, wr, kind, h, s, l, br = null) {
    const M = S.M;
    const sz = size * M.leafSize;
    return { br, seg, f, side, off: off + M.leafUp, size: sz, base: sz, g: 0, wr: wr * M.leafWr, kind, h, s, l, turn: 0, seed: Math.random() };
  }

  // ---------- Side branches ----------
  // A branch hangs off a main-stem segment and has its own short segments and leaves.
  function newBranch(seg, f, kind) {
    const M = S.M;
    let side;
    if (kind === 'slow') { S.side *= -1; side = S.side; } else side = Math.random() < 0.5 ? -1 : 1;
    const b = {
      seg: Math.min(seg, S.segs.length - 1), f, side, kind,
      a0: kind === 'slow' ? rand(0.78, 0.9) : kind === 'mid' ? rand(0.6, 1.05) : rand(0.4, 1.4),
      segs: [], pts: [],
    };
    S.branches.push(b);
    extendBranch(b);
    if (kind === 'fast' && Math.random() < 0.5) branchLeaf(b, b.segs.length - 1, 'fast');
  }
  function extendBranch(b) {
    const M = S.M;
    const len = (b.kind === 'slow' ? rand(0.5, 0.62) : b.kind === 'mid' ? rand(0.38, 0.5) : rand(0.2, 0.32)) * U * M.segLen;
    const curl = b.kind === 'slow' ? -b.side * rand(0.12, 0.18) : b.kind === 'mid' ? -b.side * rand(0, 0.2) : rand(-0.5, 0.5);
    b.segs.push({ len, dA: curl + M.lean * 0.6, g: 0 });
    branchLeaf(b, b.segs.length - 1, b.kind);
  }
  function branchLeaf(b, si, kind) {
    const bi = S.branches.indexOf(b);
    const side = kind === 'slow' ? (si % 2 ? 1 : -1) * b.side * -1 : Math.random() < 0.5 ? -1 : 1;
    if (kind === 'slow') pushLeaf(makeLeaf(si, rand(0.88, 1), side, rand(-0.3, 0), rand(20, 27) * k, 0.46, 'calm', rand(98, 112), rand(30, 38), rand(36, 44), bi));
    else if (kind === 'mid') pushLeaf(makeLeaf(si, rand(0.6, 1), side, rand(-0.35, 0.2), rand(13, 18) * k, 0.42, 'mid', rand(88, 104), rand(34, 42), rand(40, 48), bi));
    else pushLeaf(makeLeaf(si, rand(0.3, 1), side, rand(-0.6, 0.5), rand(7, 12) * k, 0.34, 'fast', rand(70, 92), rand(40, 52), rand(44, 56), bi));
  }
  function segOf(l) {
    if (l.br == null) return S.segs[l.seg];
    const b = S.branches[l.br];
    return b && b.segs[l.seg];
  }
  function pushLeaf(leaf) {
    if (Math.random() > S.M.leafKeep) return;
    S.leaves.push(leaf);
    if (Math.random() < S.M.leafExtra) {
      const c = { ...leaf, side: -leaf.side, f: clamp(leaf.f - rand(0.15, 0.4), 0.2, 1), size: leaf.size * 0.8, base: leaf.base * 0.8, seed: Math.random() };
      S.leaves.push(c);
    }
  }

  function germinate(now) {
    S.stage = 'germinating'; S.germAt = now; S.shake = 1;
    const n = S.picks.soil === 'humus' ? 6 : S.picks.soil === 'sand' ? 2 : 4;
    for (let i = 0; i < n; i++) addRoot(S.picks.soil === 'humus' ? 0.9 : 0.25);
    setStatus('germ', 'Something is waking up.');
  }

  function grow(now, force) {
    let dt = S.lastClick ? now - S.lastClick : 99999;
    S.lastClick = now;
    let kind = dt < FAST ? 'fast' : dt > SLOW ? 'slow' : 'mid';
    if (force) { kind = force; S.afterChoice = false; }
    const raw = kind;
    const counted = !S.afterChoice; // a pause spent choosing shouldn't count as patience
    if (S.afterChoice) { kind = S.marks.length ? S.marks[S.marks.length - 1].kind : 'mid'; S.afterChoice = false; }
    if (counted) S[kind]++;
    S.growth++;
    S.marks.push({ t: now, kind });
    S.kick = 1;
    const M = S.M, n = S.segs.length, cum = cumAngle();

    // 1) The main stem only grows a little each click.
    if (kind === 'slow') {
      S.segs.push({ len: U * rand(0.48, 0.58) * M.segLen, dA: -cum * 0.5 * M.correct + rand(-0.1, 0.1) + M.lean, g: 0, fast: false });
    } else if (kind === 'mid') {
      S.segs.push({ len: U * rand(0.4, 0.5) * M.segLen, dA: -cum * 0.3 * M.correct + rand(-0.22, 0.22) + M.lean, g: 0, fast: false });
    } else {
      const sign = (S.segs.length % 2 ? 1 : -1);
      S.segs.push({ len: U * rand(0.26, 0.38) * M.segLen, dA: sign * rand(0.22, 0.5) - cum * 0.12 + M.lean, g: 0, fast: true });
    }
    const top = S.segs.length - 1;

    // 2) Most of the growth goes sideways, into branches.
    if (S.segs.length < 3) {
      // too close to the ground for branches yet: a leaf on the stem instead
      S.side *= -1;
      pushLeaf(makeLeaf(top, rand(0.8, 1), S.side, rand(-0.25, 0.05), rand(12, 16) * k, 0.46, 'calm', rand(98, 108), 34, 42));
    } else if (kind === 'slow') {
      const open = S.branches.filter(b => b.kind === 'slow' && b.segs.length < 4);
      if (S.growth % 2 === 1 || !open.length) newBranch(top, rand(0.85, 1), 'slow');
      else extendBranch(open[open.length - 1]);
      S.leaves.forEach(l => { if (l.kind === 'calm') l.size = Math.min(l.size * 1.06, l.base * 1.5); });
    } else if (kind === 'mid') {
      const open = S.branches.filter(b => b.segs.length < 3);
      if (Math.random() < 0.5 || !open.length) newBranch(Math.max(2, top - Math.floor(rand(0, 2))), rand(0.5, 1), 'mid');
      else extendBranch(pick(open));
    } else {
      if (Math.random() < 0.65) newBranch(Math.max(2, top - Math.floor(rand(0, 3))), rand(0.3, 1), 'fast');
      const open = S.branches.filter(b => b.segs.length < 3);
      const times = 1 + (Math.random() < 0.5 ? 1 : 0);
      for (let j = 0; j < times && open.length; j++) extendBranch(pick(open));
      if (Math.random() < 0.35) addRoot(1);
    }
    if (Math.random() < (kind === 'fast' ? 0.3 + M.tendril : M.tendril * 0.6)) S.leaves.push(makeTendril(top));
    if (S.growth % 5 === 0) addRoot(kind === 'fast' ? 1 : 0.2);

    return { raw, dt, kind };
  }

  // ---------- One stretch = one stage of growth ----------
  // A stage is grown by hand (see "Growing" below); when its last step lands,
  // the next choice opens, or the flower forms.
  function nextStage() {
    if (S.step < STEPS.length) openChoice(performance.now());
    else startFlower(performance.now(), false);
  }
  function tickAuto(now) {
    if (S.autoDone && now >= S.autoDone.at) { const cb = S.autoDone.cb; S.autoDone = null; cb && cb(); }
    const A = S.auto;
    if (!A || A.manual || S.stage !== 'growing' || now < A.next) return;
    const rushed = now - S.rushAt < 700;
    const kind = rushed ? 'fast' : (A.i % 2 ? 'mid' : 'slow');
    grow(now, kind);
    A.i++;
    A.next = now + (rushed ? 300 : 520);
    if (A.i >= A.n) { S.auto = null; S.autoDone = { at: now + 700, cb: A.onDone }; }
  }

  // ---------- Petal shapes ----------
  const SHAPE_OF = { lush: 'round', hardy: 'star', lunar: 'lily', wild: 'frill' };
  const SHAPE_NAME = { round: 'round', star: 'pointed', lily: 'curled lily', frill: 'frilled' };
  // per-shape proportions: petal count multiplier, length, width
  const SHAPE_FIT = {
    round: { n: 0.75, len: 0.95, w: 0.95 },
    star:  { n: 1.5, len: 1.05, w: 0.55 },
    lily:  { n: 0.8, len: 1.25, w: 0.75 },
    frill: { n: 0.85, len: 1, w: 0.85 },
  };
  // Draws one petal pointing along +x, starting at r0. `tip` (0..1) blunts the
  // classic shape; `flip` sets which way a lily tip curls; `seed` varies frills.
  function petalPath(g, p, r0, len, w, tip) {
    const x = u => r0 + len * u;
    g.beginPath();
    switch (p.shape) {
      case 'round': { // spoon-shaped, wide rounded end
        g.moveTo(r0, 0);
        g.bezierCurveTo(x(0.18), -w * 0.45, x(0.55), -w * 1.25, x(0.9), -w * 0.78);
        g.quadraticCurveTo(x(1.06), 0, x(0.9), w * 0.78);
        g.bezierCurveTo(x(0.55), w * 1.25, x(0.18), w * 0.45, r0, 0);
        break;
      }
      case 'star': { // narrow, straight-sided, sharp point
        g.moveTo(r0, 0);
        g.lineTo(x(0.28), -w * 0.9);
        g.quadraticCurveTo(x(0.6), -w * 0.55, x(1), 0);
        g.quadraticCurveTo(x(0.6), w * 0.55, x(0.28), w * 0.9);
        g.closePath();
        break;
      }
      case 'lily': { // long, tip curls back to one side
        const s = p.flip || 1;
        g.moveTo(r0, 0);
        g.bezierCurveTo(x(0.3), -w * 1.05, x(0.78), -w * 0.75, x(1), s * w * 0.55);
        g.quadraticCurveTo(x(0.9), s * w * 0.85, x(0.82), s * w * 0.6);
        g.bezierCurveTo(x(0.7), w * 0.95, x(0.3), w * 1.05, r0, 0);
        break;
      }
      case 'frill': { // ruffled, jagged outline
        const N = 14, seed = p.seed || 1;
        const half = u => w * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.05)), 0.7) * (0.55 + 0.45 * u);
        g.moveTo(r0, 0);
        for (let i = 1; i <= N; i++) {
          const u = i / N, j = i % 2 ? 1.25 : 0.8 + 0.15 * Math.sin(seed + i);
          g.lineTo(x(u * 0.97), -half(u) * j);
        }
        g.lineTo(x(1), 0);
        for (let i = N; i >= 1; i--) {
          const u = i / N, j = i % 2 ? 1.25 : 0.8 + 0.15 * Math.cos(seed + i);
          g.lineTo(x(u * 0.97), half(u) * j);
        }
        g.closePath();
        break;
      }
      default: { // classic oval (older archive records)
        g.moveTo(r0, 0);
        g.bezierCurveTo(x(0.3), -w, x(1), -w * tip, x(1), 0);
        g.bezierCurveTo(x(1), w * tip, x(0.3), w, r0, 0);
      }
    }
  }
  // A thin centre vein on lily and round petals makes the shape read at small sizes.
  function petalVein(g, p, r0, len, lw) {
    if (p.shape !== 'lily' && p.shape !== 'round') return;
    g.beginPath(); g.moveTo(r0 + len * 0.1, 0);
    g.quadraticCurveTo(r0 + len * 0.6, 0, r0 + len * (p.shape === 'lily' ? 0.9 : 0.75), p.shape === 'lily' ? (p.flip || 1) * len * 0.04 : 0);
    g.lineWidth = lw; g.stroke();
  }

  // ---------- Flower ----------
  function startFlower(now, bud) {
    if (S.flower) return;
    const M = S.M;
    const total = Math.max(1, S.fast + S.slow + S.mid);
    const ratio = S.fast / total;
    // base palette from the light + climate choices
    let hue = rand(22, 38), sat = 60, lit = 86;
    if (M.sun) { hue = rand(36, 46); sat = 78; lit = 76; }
    if (M.moon) { hue = 220; sat = 22; lit = 93; }
    if (M.shade) { hue = rand(270, 290); sat = 34; lit = 72; }
    if (M.frost) { hue = 200; sat *= 0.75; lit = Math.min(94, lit + 4); }
    if (M.warmth) { if (!M.moon) hue = rand(10, 22); sat = Math.min(92, sat + 18); lit -= 8; }
    let wild = [330, 12, 290, 345, 25, 305];
    if (M.frost) wild = [190, 210, 250, 175, 230];
    else if (M.moon) wild = [260, 200, 300, 230];
    else if (M.warmth) wild = [8, 20, 340, 35, 355];

    const f = { bud, ratio, bloom: 0, open: bud ? 0.1 : 0.7, petals: [], dots: [], glow: M.moon };
    if (!bud) {
      // Petal SHAPE comes from the plant's two strongest traits:
      // outer ring = strongest, inner rings = second strongest.
      const tr = { ...S.traits };
      tr.wild += ratio * 3;
      tr.lush += (S.slow / Math.max(1, S.growth)) * 2;
      const order = Object.keys(tr).sort((a, b) => tr[b] - tr[a]);
      const shapes = [SHAPE_OF[order[0]], SHAPE_OF[order[1]]];
      f.shapes = shapes; f.order = order;
      const jitter = clamp(ratio * 1.15, 0, 1);
      const n0 = 5 + Math.round(ratio * 9) + M.petalsExtra - (M.wind ? 1 : 0);
      const rings = Math.max(2, (ratio > 0.5 ? 3 : ratio > 0.3 ? 2 : 1) + (M.bee ? 1 : 0));
      const baseL = (ratio > 0.5 ? 22 : 26) * k * (0.85 + S.growth * 0.01) * M.bloom;
      for (let r = 0; r < rings; r++) {
        const shape = r === 0 ? shapes[0] : shapes[1];
        const SH = SHAPE_FIT[shape];
        const nr = Math.max(4, Math.round((n0 + r * Math.round(ratio * 3)) * SH.n) - (r > 0 && ratio < 0.3 ? 1 : 0));
        const flip = Math.random() < 0.5 ? -1 : 1;
        for (let i = 0; i < nr; i++) {
          const chaotic = Math.random() < ratio;
          const h = chaotic ? pick(wild) + rand(-8, 8) : hue;
          f.petals.push({
            ring: r, shape, flip, seed: Math.round(Math.random() * 1000),
            a: (i / nr) * Math.PI * 2 + r * (Math.PI / nr) + jitter * rand(-0.38, 0.38),
            len: baseL * SH.len * (1 - r * 0.38) * (1 + jitter * rand(-0.45, 0.5)),
            w: SH.w * (0.48 - jitter * 0.16) * (1 + jitter * rand(-0.3, 0.3)),
            point: M.frost ? Math.max(jitter, 0.6) : jitter,
            col: chaotic ? `hsl(${h},${rand(62, 78) * (M.frost ? 0.7 : 1)}%,${rand(56, 70) - r * 6}%)` : `hsl(${h},${Math.max(10, sat - r * 8)}%,${lit - r * 9}%)`,
          });
        }
      }
      const nd = Math.round(4 + ratio * 18 + (M.bee ? 14 : 0));
      for (let i = 0; i < nd; i++) f.dots.push({ a: rand(0, Math.PI * 2), r: rand(1, 7 + ratio * 4) * k, s: rand(0.8, 1.8) });
      f.center = M.fungus ? 'hsl(285,45%,42%)' : `hsl(${ratio > 0.5 ? 48 : 40},80%,${ratio > 0.5 ? 50 : 56}%)`;
      f.dot = M.bee ? 'rgba(250,210,80,0.95)' : 'rgba(60,40,20,0.75)';
    } else {
      f.col = `hsl(${M.moon ? 220 : M.frost ? 205 : M.shade ? 285 : 340},${M.moon ? 20 : 45}%,${M.moon ? 88 : 64}%)`;
    }
    S.flower = f; S.stage = 'flowering';
    hideChoice();
    // bud gives way, then the petals unfurl one after another
    Sound.pop();
    if (!bud) for (let i = 0; i < 6; i++) setTimeout(() => { if (S.flower === f) Sound.petal(i); }, 700 + i * 260);
  }

  // ---------- Branch result ----------
  const TYPES = {
    lush:  { en: 'Garden Bloom', adj: 'Lush' },
    hardy: { en: 'Stonewort', adj: 'Hardy' },
    lunar: { en: 'Moon Lily', adj: 'Quiet' },
    wild:  { en: 'Tangleweed', adj: 'Wild' },
  };
  function finish(now) {
    S.stage = 'mature';
    Sound.bloom();
    const f = S.flower;
    const tr = { ...S.traits };
    tr.wild += f.ratio * 3;
    tr.lush += (S.slow / Math.max(1, S.growth)) * 2;
    if (f.bud) tr.hardy += 1;
    const order = Object.keys(tr).sort((a, b) => tr[b] - tr[a]);
    const p = TYPES[order[0]], s = TYPES[order[1]];
    const name = (f.bud ? 'Sleeping' : s.adj) + ' ' + p.en;
    const en = (f.bud ? 'Sleeping ' : '') + p.en;
    $('kind').innerHTML = `${name}`;

    let rhythm;
    if (f.bud) rhythm = 'It was mostly left alone, so it stayed small and its flower stayed closed.';
    else if (f.ratio > 0.5) rhythm = 'Quick, restless hands: a twisted stem, many small leaves and layers of irregular petals.';
    else if (f.ratio < 0.25 && S.slow >= S.mid) rhythm = 'Patient hands: a balanced stem, broad leaves and a simple, symmetrical flower.';
    else rhythm = 'Your rhythm was sometimes fast and sometimes slow, so it grew somewhere in between.';
    const picks = STEPS.filter(st => S.picks[st.key]).map(st => st.opts.find(o => o.id === S.picks[st.key]).en);
    const skipped = STEPS.length - picks.length;
    const pathLine = picks.length ? `${picks.join(' → ')}${skipped ? ` (${skipped} step${skipped > 1 ? 's' : ''} never reached)` : ''}. ` : '';
    let petals = '';
    if (f.shapes) petals = f.shapes[0] === f.shapes[1]
      ? `${SHAPE_NAME[f.shapes[0]][0].toUpperCase() + SHAPE_NAME[f.shapes[0]].slice(1)} petals.`
      : `${SHAPE_NAME[f.shapes[0]][0].toUpperCase() + SHAPE_NAME[f.shapes[0]].slice(1)} outer petals, ${SHAPE_NAME[f.shapes[1]]} inner petals.`;
    $('finalNote').textContent = `${pathLine}${petals ? petals + ' ' : ''}${rhythm}${f.bud ? ' Bring your cursor close and it opens a little.' : ' Move your cursor near it.'}`;
    cv.setAttribute('aria-label', `Your grown plant: ${en}. ${pathLine}${rhythm}`);
    S.result = { name, path: picks, skipped, note: rhythm, kind: order[0], petals };
    S.matureAt = now;
    setStatus('pick', f.bud
      ? 'It has grown. Move your cursor to see it respond, <b>then pull the bud until it snaps.</b>'
      : 'It has bloomed. Move your cursor to see it respond, <b>then pull the flower until it snaps.</b>');
  }

  // ---------- Picking the flower ----------
  function flowerHit(x, y) {
    const top = S.pts[S.pts.length - 1];
    if (!top || !S.flower) return false;
    return Math.hypot(x - top.x, y - (top.y - 10 * k)) < (S.flower.bud ? 30 : 46) * k + 10;
  }
  function pickFlower(now) {
    const top = S.pts[S.pts.length - 1];
    S.stage = 'picked';
    S.pick = { t0: now, x: top.x, y: top.y, a: top.a * 0.6, prog: 0, shown: false };
    S.kick = 1.2;
    // a couple of petals shaken loose by the snap
    if (!S.flower.bud) for (let i = 0; i < 4; i++)
      S.parts.push({ type: 'petal', x: top.x, y: top.y - 8 * k, vx: rand(-1, 1), vy: rand(-1.4, -0.4), r: rand(0, 6), life: 1, col: pick(S.flower.petals).col });
    setStatus('plucked', '');
    cv.style.cursor = 'default';
  }
  function flowerRadius() {
    const f = S.flower;
    if (f.bud) return 18 * k;
    return Math.max(...f.petals.map(p => p.len)) + 3 * k;
  }
  // where the picked flower is drawn, eased from the stem tip to the centre of the screen
  function pickPose() {
    const p = S.pick, e = ease(p.prog);
    const tx = W / 2, ty = Math.max(160, H * 0.36);
    const zoom = clamp(Math.min(W, H) * (S.flower.bud ? 0.13 : 0.2) / flowerRadius(), 1.6, 6);
    const lift = Math.sin(Math.PI * clamp(p.prog, 0, 1)) * 30;
    return { x: p.x + (tx - p.x) * e, y: p.y + (ty - p.y) * e - lift, a: p.a * (1 - e) + Math.sin(p.prog * 9) * 0.25 * (1 - e), s: 1 + (zoom - 1) * e, stub: true };
  }
  function showFinal() {
    document.body.classList.add('done');
    finalEl.classList.add('show');
    finalEl.setAttribute('aria-hidden', 'false');
  }

  // ---------- Input ----------
  function nearPlant(x, y) {
    if (S.stage === 'seed' || S.stage === 'germinating') return Math.hypot(x - baseX, y - (baseY - 4)) < 46;
    for (const p of S.pts) if (Math.hypot(x - p.x, y - p.y) < 60) return true;
    for (const b of S.branches) for (const p of b.pts) if (Math.hypot(x - p.x, y - p.y) < 40) return true;
    return false;
  }
  function act(x, y) {
    const now = performance.now();
    if (TUT) { tutAct(x, y, now); return; }
    if (S.stage === 'seed') return; // the seed is dragged, not clicked
    if (S.stage === 'choosing') { S.kick = 0.4; return; }
    // growing and picking are drags now (see stretch / tug below); a plain click just nudges the plant
    if ((S.stage === 'growing' || S.stage === 'mature') && nearPlant(x, y)) S.kick = 0.6;
  }
  // ---------- Sowing: drag the floating seed over the hole and let go (Planting a Seed) ----------
  const HOLE = () => ({ x: baseX, y: baseY + 2 });
  const SEED_R = 11;                                   // seed half-height: its centre sits this far above its bottom
  function airPos(t) {
    return { x: baseX + Math.sin(t * 0.0007) * 6 * RM, y: baseY - Math.min(availH * 0.55, 230) + Math.sin(t * 0.0016) * 7 * RM };
  }
  function seedPos(t) {
    const sd = S.sd;
    if (sd.mode === 'air') return airPos(t);
    if (sd.mode === 'in') return { x: baseX, y: baseY - 4 };
    return { x: sd.x, y: sd.y };
  }
  // lined up when the seed is over the opening and still above it
  const seedAligned = () => Math.abs(S.sd.x - baseX) <= 22 && S.sd.y + SEED_R <= baseY + 4;
  function dropFrom(p) {
    const sd = S.sd;
    sd.x = p.x; sd.y = p.y; sd.vx = 0; sd.vy = 0;
    if (seedAligned()) { sd.mode = 'fall'; sd.bounce = 0; setStatus('falling', ''); }
    else { sd.mode = 'fail'; sd.failT = 0; setStatus('missed', 'Not quite. <b>Let go right over the hole.</b>'); }
  }
  function plantSeed(now) {
    S.sd.mode = 'in';
    S.shake = 0.8;
    for (let i = 0; i < 6; i++)
      S.parts.push({ type: 'petal', x: baseX + rand(-6, 6), y: baseY - 2, vx: rand(-1.2, 1.2), vy: rand(-1.6, -0.6), r: rand(0, 6), life: 0.55, col: 'hsl(30,28%,30%)' });
    setStatus('planted', '');
    setTimeout(() => {
      if (S.stage !== 'seed') return;
      if (TUT) tutPlanted(); else openChoice(performance.now());
    }, 450);
  }
  // gravity, three shrinking bounces with squash, settle; a miss falls briefly then springs home
  function seedPhysics(now, dt) {
    const sd = S.sd, G = 2600, FLOOR = baseY - 4, BOUNCES = [12, 5, 2];
    if (sd.mode === 'fall') {
      sd.vy += G * dt; sd.y += sd.vy * dt;
      sd.x += (baseX - sd.x) * Math.min(1, dt * 12);
      if (sd.y >= FLOOR) {
        sd.y = FLOOR;
        const impact = sd.vy;
        Sound.thud(impact / 1000);
        if (!reduce) { sd.sq = Math.min(0.3, impact / 3200); sd.sqV = 0; }
        if (!reduce && sd.bounce < BOUNCES.length) { sd.vy = -Math.sqrt(2 * G * BOUNCES[sd.bounce] * k); sd.bounce++; }
        else { sd.vy = 0; sd.x = baseX; plantSeed(now); }
      }
    } else if (sd.mode === 'fail') {
      sd.vy += G * dt; sd.y += sd.vy * dt; sd.failT += dt;
      if (sd.failT > 0.22) { sd.mode = 'return'; sd.vx = 0; sd.vy *= 0.35; }
    } else if (sd.mode === 'return') {
      const home = airPos(now), kk = 160, c = 20;
      sd.vx += (kk * (home.x - sd.x) - c * sd.vx) * dt;
      sd.vy += (kk * (home.y - sd.y) - c * sd.vy) * dt;
      sd.x += sd.vx * dt; sd.y += sd.vy * dt;
      // home keeps bobbing, so settle once close and slow, then hand back to the float
      if (Math.hypot(home.x - sd.x, home.y - sd.y) < 2 && Math.hypot(sd.vx, sd.vy) < 40) sd.mode = 'air';
    }
    // squash springs back to round; hover / hold enlargement
    sd.sqV += (-900 * sd.sq - 26 * sd.sqV) * dt; sd.sq += sd.sqV * dt;
    if (Math.abs(sd.sq) < 0.001 && Math.abs(sd.sqV) < 0.01) { sd.sq = 0; sd.sqV = 0; }
    const p = seedPos(now);
    const hov = sd.mode === 'air' && S.mouse.on && Math.hypot(S.mouse.x - p.x, S.mouse.y - p.y) < 38;
    const target = sd.mode === 'drag' ? 1.14 : hov ? 1.08 : 1;
    sd.hs += (target - sd.hs) * Math.min(1, dt * 16);
  }

  // ---------- Growing: grab the tip and stretch it upward (Grow a Flower) ----------
  // Each stage (between two choices) is a fixed number of growth steps. Upward travel commits
  // steps and growth only moves forward. How fast you pull sets each step's rhythm:
  // a slow, steady pull is patient; a yank rushes it and twists the stem.
  const stepLen = () => Math.max(16, U * 0.8);
  function tipHit(x, y) {
    const top = S.pts[S.pts.length - 1];
    return !!top && S.pts.length > 1 && Math.hypot(x - top.x, y - top.y) < 50;
  }
  function stageOpen() {
    if (S.stage !== 'growing' || S.autoDone) return false;
    if (S.auto && !S.auto.manual) return false;
    return !TUT || (tutAccepts() && tutCur().id === 'grow');
  }
  function beginStage() {
    if (S.auto) return S.auto;
    const n = S.step >= STEPS.length ? 3 : 4;
    const next = TUT ? tutCur().next : null;
    S.auto = { n, i: 0, prog: 0, manual: true, onDone: TUT ? () => tutGrowDone(next) : nextStage };
    return S.auto;
  }
  function stageStep(now, kind) {
    const A = S.auto;
    if (!A || A.i >= A.n) return;
    const r = grow(now, kind);
    if (r.kind === 'fast') S.rushAt = now;
    A.i++;
    Sound.rustle(S.side * 0.3, 0, r.kind === 'fast' ? 0.45 : 0.3);
    if (A.i >= A.n) {
      endStretch();
      S.auto = null;
      S.autoDone = { at: now + 700, cb: A.onDone };

    }
  }
  const kindOf = v => v > 520 ? 'fast' : v < 170 ? 'slow' : 'mid';   // pull speed in px/s
  function startStretch(e, x, y) {
    const A = beginStage();
    const top = S.pts[S.pts.length - 1];
    S.st = { id: e.pointerId, startY: y, base: A.prog, offX: x - top.x, offY: y - top.y, v: 0, lastY: y, lastT: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    tune(S.pull, 150, 19); tune(S.bend, 200, 19);
    cv.style.cursor = 'grabbing';
  }
  function stretchMove(e) {
    const st = S.st, A = S.auto;
    if (!st || e.pointerId !== st.id || !A) return;
    const now = performance.now(), x = e.clientX, y = e.clientY;
    const dt = Math.max(0.008, (now - st.lastT) / 1000);

  }
  function endStretch() {
    const st = S.st;
    if (!st) return;
    try { cv.releasePointerCapture(st.id); } catch (err) {}

    S.pull.t = 0; S.bend.t = 0;
    tune(S.pull, 130, 8); tune(S.bend, 110, 7);              // gentle elastic settle
    cv.style.cursor = 'default';
  }

  // ---------- Picking: pull the flower until the stem snaps (Pick a Flower) ----------
  const snapAt = () => Math.max(110, flowerRadius() * 2.6); // about one flower-head diameter of pull
  const KB_RATE = 1 / 1.5;                                   // holding Space reaches the snap in 1.5 s
  function tugOpen(now) {
    return S.stage === 'mature' && now - S.matureAt > 400 && S.tug.id === null && S.tug.phase !== 'recoil'
      && (!TUT || (tutAccepts() && tutCur().id === 'pick'));
  }
  function startTug(id, p) {
    const tg = S.tug;
    tg.id = id; tg.phase = 'pull'; tg.lastP = p; tg.grabStart = p;
    tg.Gbase = [tg.D[0] / 0.74, tg.D[1] / 0.74];
    cv.style.cursor = 'grabbing';
  }
  function endTug(id) {
    const tg = S.tug;
    if (tg.id === null || id !== tg.id) return;
    if (id !== 'kb') { try { cv.releasePointerCapture(id); } catch (err) {} }
    tg.id = null; tg.kb = false;
    if (tg.phase === 'pull') { tg.phase = 'return'; tg.sK = 280; tg.sC = 15; tg.Dv = [0, 0]; }
    cv.style.cursor = 'default';
  }
  function snap(now) {
    const tg = S.tug, top = S.pts[S.pts.length - 1];
    Sound.snap();
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
    S.burst = { t0: now, x: top.x, y: top.y };
    const id = tg.id;
    tg.id = null; tg.kb = false;
    if (id !== null && id !== 'kb') { try { cv.releasePointerCapture(id); } catch (err) {} }
    tg.phase = 'recoil'; tg.sK = 720; tg.sC = 15; tg.Dv = [0, 0];   // underdamped: short recoil, quick settle
    if (TUT) { TUT.busy = 'Picking…'; renderTut(); }
    pickFlower(now);
  }
  function tugPhysics(now, dt) {
    const tg = S.tug;
    tg.t = 0; tg.jx = 0; tg.jy = 0;
    if (tg.phase === 'pull') {
      if (tg.kb) tg.lastP = [tg.lastP[0], tg.lastP[1] - KB_RATE * snapAt() * dt];
      const Gx = tg.lastP[0] - tg.grabStart[0] + tg.Gbase[0], Gy = tg.lastP[1] - tg.grabStart[1] + tg.Gbase[1];
      tg.t = Math.min(Math.hypot(Gx, Gy) / snapAt(), 1);
      const res = 0.74 - 0.2 * tg.t;                          // resistance grows with distance
      const a = 1 - Math.exp(-dt * 26);

  // ---------- Input ----------
  cv.addEventListener('pointerdown', e => {
    const x = e.clientX, y = e.clientY, now = performance.now();
    Sound.init();

      const p = seedPos(now);
      if (Math.hypot(x - p.x, y - p.y) < 38) {
        Object.assign(S.sd, { mode: 'drag', x: p.x, y: p.y, ox: p.x - x, oy: p.y - y });
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        cv.style.cursor = 'grabbing';

    if (tugOpen(now) && flowerHit(x, y)) {
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      startTug(e.pointerId, [x, y]);
      return;
    }
    act(x, y);
  });
  function dropSeed(e) {
    if (S.sd.mode !== 'drag') return;

    cv.style.cursor = 'default';
  }
  function onUp(e) {

  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('pointermove', e => {
    S.mouse.x = e.clientX; S.mouse.y = e.clientY; S.mouse.on = true;

    if (S.st) { stretchMove(e); return; }
    if (S.tug.id !== null) { if (e.pointerId === S.tug.id) S.tug.lastP = [x, y]; return; }
    if (S.stage === 'seed') {
      const p = seedPos(performance.now());
      cv.style.cursor = S.sd.mode === 'air' && Math.hypot(x - p.x, y - p.y) < 38 ? 'grab' : 'default';
      return;

  cv.addEventListener('pointerleave', () => { S.mouse.on = false; });

    }

  // ---------- Update ----------
  function update(now) {
    const idle = S.lastClick ? now - S.lastClick : 0;
    const dt = S.lastT ? Math.min(1 / 30, Math.max(0.001, (now - S.lastT) / 1000)) : 1 / 60;
    S.lastT = now;
    for (let left = dt; left > 0; left -= 1 / 120) { const h = Math.min(left, 1 / 120); stepSpring(S.pull, h); stepSpring(S.bend, h); }

    S.tint.h += (T.h - S.tint.h) * 0.03; S.tint.s += (T.s - S.tint.s) * 0.03; S.tint.l += (T.l - S.tint.l) * 0.03;
    S.sky.sun += ((S.M.sun ? 1 : 0) - S.sky.sun) * 0.02;
    S.sky.moon += ((S.M.moon ? 1 : 0) - S.sky.moon) * 0.02;

    }

      else if (S.autoDone) setStatus('auto', S.step >= STEPS.length ? 'Growing toward a flower\u2026' : 'Growing\u2026 let it take its time.');

    }
    if (S.stage === 'flowering') {
      setStatus('flower', S.flower.bud ? 'It\u2019s closing into a small bud.' : 'A flower is forming.');
      S.flower.bloom = Math.min(1, S.flower.bloom + 1 / (60 * (S.flower.bud ? 2 : 2.8)));

      if (S.flower.bloom >= 1) { finish(now); if (TUT) tutBloomed(); }
    }
    if (S.stage === 'mature' && S.flower) {
      const top = S.pts[S.pts.length - 1];

      if (S.mouse.on && top) prox = clamp(1 - Math.hypot(S.mouse.x - top.x, S.mouse.y - top.y) / (260 * k), 0, 1);
      const target = S.flower.bud ? 0.08 + 0.42 * prox : (S.M.warmth ? 0.62 : 0.5) + 0.45 * prox;

  // ---------- Draw ----------
  function leafColor(h, s, l, a = 1) {
    return `hsla(${h + S.tint.h},${clamp(s * S.tint.s, 4, 90)}%,${clamp(l + S.tint.l, 10, 90)}%,${a})`;
  }
  function swayA(i, t) {
    const amp = RM * (S.breath * 0.02 + 0.003);
    const gust = S.M.wind ? (0.6 + 0.4 * Math.sin(t * 0.0007)) * 0.012 * RM : 0;
    return amp * Math.sin(t * 0.0011 - i * 0.45) + S.kick * 0.035 * RM * Math.sin(t * 0.024 - i * 0.7) + gust * Math.sin(t * 0.003 - i * 0.5) + S.M.wind * (S.segs[i] ? ease(S.segs[i].g) : 0);

    const tg = S.tug;

    if (pts.length > 1 && Math.abs(Dx) + Math.abs(Dy) > 0.01) {

      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
      const total = cum[cum.length - 1] || 1;

      }

    }

      const g0 = b.segs.length ? ease(b.segs[0].g) : 0;

      b.segs.forEach((s, i) => {
        ba += s.dA * ease(s.g) + swayA(b.seg + i + 1, t) * 1.4 + Math.sin(t * 0.0013 + bi) * 0.01 * S.breath * RM;
        const L = s.len * ease(s.g) * S.scale;
