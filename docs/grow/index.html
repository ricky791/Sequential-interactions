    }
    if (pts.length) out.push({ ...pts[pts.length - 1], seg: pts.length - 2 });
    return out;
  }

  function drawSky(t) {
    const sx = W * 0.82, sy = Math.max(110, H * 0.18);
    if (S.sky.sun > 0.01) {
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.6);
      g.addColorStop(0, `rgba(240,190,110,${0.16 * S.sky.sun})`); g.addColorStop(1, 'rgba(240,190,110,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(245,200,120,${0.5 * S.sky.sun})`;
      ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI * 2); ctx.fill();
    }
    if (S.sky.moon > 0.01) {
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.5);
      g.addColorStop(0, `rgba(180,200,235,${0.1 * S.sky.moon})`); g.addColorStop(1, 'rgba(180,200,235,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(225,232,245,${0.6 * S.sky.moon})`;
      ctx.beginPath(); ctx.arc(sx, sy, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(16,19,15,${0.9 * S.sky.moon})`;
      ctx.beginPath(); ctx.arc(sx + 6, sy - 3, 11, 0, Math.PI * 2); ctx.fill();
    }
    if (S.sky.shade > 0.01) {
      // light leaks in from one side; the plant leans toward it
      const g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, `rgba(0,0,0,${0.35 * S.sky.shade})`); g.addColorStop(0.7, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(200,210,160,${0.07 * S.sky.shade})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  function drawGround() {
    const half = Math.min(W * 0.36, 320);
    const soil = S.picks.soil;
    const dot = soil === 'clay' ? '#5a4129' : soil === 'sand' ? '#7d6a45' : soil === 'humus' ? '#3a2d20' : C.soil;
    ctx.strokeStyle = C.soil; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(baseX - half, baseY + 2); ctx.lineTo(baseX + half, baseY + 2); ctx.stroke();
    ctx.fillStyle = dot;
    const count = soil === 'sand' ? 90 : soil === 'humus' ? 70 : 46;
    for (let i = 0; i < count; i++) {
      const sx = baseX + Math.sin(i * 91.7) * Math.min(W * 0.34, 300);
      const sy = baseY + 8 + Math.abs(Math.sin(i * 13.1)) * 60;
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(i * 3.3));
      const s = soil === 'sand' ? 1.4 : soil === 'clay' ? 3 : 2;
      ctx.fillRect(sx, sy, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawRoots() {
    ctx.lineCap = 'round';
    S.roots.forEach(r => {
      const L = r.len * ease(r.g);
      ctx.strokeStyle = 'rgba(200,180,140,0.55)';
      ctx.lineWidth = S.picks.soil === 'clay' ? 1.8 : S.picks.soil === 'sand' ? 0.9 : 1.2;
      ctx.beginPath();
      let x = baseX, y = baseY + 4, a = r.a * 0.5;
      ctx.moveTo(x, y);
      for (let i = 1; i <= 10; i++) {
        a += (r.a - a) * 0.15 + Math.sin(r.ph + i * 1.3) * 0.12 * r.w;
        x += Math.sin(a) * L / 10; y += Math.cos(a) * L / 10;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
  }

  function drawShrooms(t) {
    S.shrooms.forEach(m => {
      const g = ease(clamp(m.g * 1.4 - m.d, 0, 1));
      if (g < 0.02) return;
      const x = baseX + m.x, y = baseY + 1, h = 12 * m.s * g, r = 7 * m.s * g;
      ctx.fillStyle = 'hsl(40,20%,78%)';
      ctx.fillRect(x - 1.5 * m.s, y - h, 3 * m.s, h);
      ctx.fillStyle = `hsl(${m.h},38%,48%)`;
      ctx.beginPath(); ctx.ellipse(x, y - h, r, r * 0.6, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(240,230,250,0.7)';
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - h - r * 0.3, 1.1, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawHole(t) {
    if (S.stage !== 'seed' || S.sd.mode === 'in') return;
    const h = HOLE(), sd = S.sd;
    const sp = seedPos(t);
    const over = sd.mode === 'drag' && seedAligned();
    // shadow of the seed on the ground: smaller and fainter the higher it floats
    const lift = clamp((h.y - sp.y) / 260, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.35 - lift * 0.2})`;
    ctx.beginPath(); ctx.ellipse(sp.x, h.y + 1, 10 - lift * 5, 2.6 - lift * 1.2, 0, 0, Math.PI * 2); ctx.fill();
    // the dug hole with a little mound of soil
    ctx.fillStyle = '#5a4630';
    ctx.beginPath(); ctx.ellipse(h.x - 25, h.y - 1, 11, 6, -0.15, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(h.x + 24, h.y - 1, 9, 5, 0.15, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#3a2d20';
    ctx.beginPath(); ctx.ellipse(h.x, h.y, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#060705';
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 0.5, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
    // dotted guide from the floating seed down to the hole
    if (sd.mode === 'air') {
      const p = (Math.sin(t * 0.003) + 1) / 2;
      ctx.save(); ctx.setLineDash([2, 7]); ctx.lineDashOffset = -t * 0.03;
      ctx.strokeStyle = `rgba(232,227,212,${0.12 + p * 0.12})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sp.x, sp.y + 20); ctx.lineTo(h.x, h.y - 8); ctx.stroke();
      ctx.restore();
    }
    if (sd.mode === 'drag') {
      const p = (Math.sin(t * 0.008) + 1) / 2;
      ctx.strokeStyle = over ? `rgba(147,180,198,${0.7 + p * 0.3})` : 'rgba(232,227,212,0.25)';
      ctx.lineWidth = over ? 2 : 1;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, 26 + p * 3, 9 + p, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawSeed(t) {
    const shakeX = Math.sin(t * 0.09) * S.shake * 4 * RM;
    const sp = S.stage === 'seed' ? seedPos(t) : { x: baseX, y: baseY - 4 };
    const x = sp.x + shakeX, y = sp.y;
    if (S.stage === 'seed' && S.sd.mode === 'air') {
      const p = (Math.sin(t * 0.0025) + 1) / 2;
      ctx.strokeStyle = `rgba(232,227,212,${0.08 + p * 0.12})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 20 + p * 8, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save(); ctx.translate(x, y);
    // hover/hold enlargement, stretch along the fall, squash on impact (scaled about the seed's bottom)
    const sd = S.sd;
    if (S.stage === 'seed') {
      const stretch = !reduce && (sd.mode === 'fall' || sd.mode === 'fail') ? Math.min(0.14, Math.abs(sd.vy) / 6000) : 0;
      const sy = (1 + stretch) * (1 - sd.sq), sx = 1 / Math.sqrt(Math.max(0.5, sy));
      ctx.translate(0, SEED_R); ctx.scale(sd.hs * sx, sd.hs * sy); ctx.translate(0, -SEED_R);
    }
    ctx.rotate(-0.25 + S.shake * Math.sin(t * 0.07) * 0.2);
    const c = S.crack;
    [-1, 1].forEach(h => {
      ctx.save(); ctx.translate(h * c * 2.2, 0); ctx.rotate(h * c * 0.18);
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 11, 0, h < 0 ? Math.PI / 2 : -Math.PI / 2, h < 0 ? Math.PI * 1.5 : Math.PI / 2);
      ctx.closePath();
      ctx.fillStyle = `hsl(32,${38 - c * 14}%,${38 - c * 12}%)`; ctx.fill();
      ctx.restore();
    });
    ctx.fillStyle = 'rgba(255,240,210,0.18)';
    ctx.beginPath(); ctx.ellipse(-3, -4, 2.2, 4, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBranches(t) {
    const w0 = clamp(2.6 + S.growth * 0.14, 2.6, 7) * k * S.M.stemW;
    ctx.lineCap = 'round';
    S.branches.forEach(b => {
      if (b.pts.length < 2) return;
      const fine = catmull(b.pts), n = fine.length;
      const bw = w0 * (b.kind === 'fast' ? 0.32 : 0.45);
      for (let i = 0; i < n - 1; i++) {
        const u = i / (n - 1);
        ctx.strokeStyle = leafColor(94 + S.M.stemHue * 0.5, 36, 36 + u * 10);
        ctx.lineWidth = Math.max(0.9, bw * (1 - u * 0.6));
        ctx.beginPath(); ctx.moveTo(fine[i].x, fine[i].y); ctx.lineTo(fine[i + 1].x, fine[i + 1].y); ctx.stroke();
      }
    });
  }

  function drawStem(pts, fine, t) {
    if (pts.length < 2) return;
    const n = fine.length;
    const tv = Math.min(1, Math.hypot(S.tug.D[0], S.tug.D[1]) / (snapAtSafe() * 0.56));
    const thin = (1 - 0.22 * clamp(S.pull.x / (26 * k), 0, 1)) * (1 - 0.28 * tv);   // gummy thinning under tension
    const w0 = clamp(2.6 + S.growth * 0.14, 2.6, 7) * k * S.M.stemW * thin;
    ctx.lineCap = 'round';
    for (let i = 0; i < n - 1; i++) {
      const u = i / (n - 1);
      ctx.strokeStyle = leafColor(96 - u * 6 + S.M.stemHue, 32 + u * 8, 30 + u * 14);
      ctx.lineWidth = Math.max(1.2, w0 * (1 - u * 0.75));
      ctx.beginPath(); ctx.moveTo(fine[i].x, fine[i].y); ctx.lineTo(fine[i + 1].x, fine[i + 1].y); ctx.stroke();
    }
    // twist for rushed segments, a wrapping vine if chosen
    const wrapLine = (test, col, freq, amp) => {
      ctx.strokeStyle = col; ctx.lineWidth = 0.9; ctx.beginPath();
      let open = false;
      for (let i = 1; i < n - 1; i++) {
        if (!test(fine[i])) { open = false; continue; }
        const dx = fine[i + 1].x - fine[i - 1].x, dy = fine[i + 1].y - fine[i - 1].y, d = Math.hypot(dx, dy) || 1;
        const u = i / (n - 1);
        const off = Math.sin(i * freq + t * 0.002) * w0 * (1 - u * 0.7) * amp;
        const x = fine[i].x - dy / d * off, y = fine[i].y + dx / d * off;
        if (!open) { ctx.moveTo(x, y); open = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    wrapLine(p => S.segs[p.seg] && S.segs[p.seg].fast, 'rgba(190,210,120,0.55)', 0.9, 0.9);
    if (S.M.vine) { ctx.lineWidth = 1.4; wrapLine(() => true, 'rgba(140,180,80,0.8)', 0.45, 1.6); }
    if (S.M.frost) {
      ctx.fillStyle = 'rgba(225,240,250,0.85)';
      for (let i = 4; i < n; i += 9) ctx.fillRect(fine[i].x + 1.5, fine[i].y, 1.5, 1.5);
    }
  }

  function leafPose(l, pts, t) {
    const P = l.br == null ? pts : (S.branches[l.br] ? S.branches[l.br].pts : []);
    const a0 = P[l.seg], a1 = P[l.seg + 1];
    if (!a0 || !a1) return null;
    const x = a0.x + (a1.x - a0.x) * l.f, y = a0.y + (a1.y - a0.y) * l.f;
    let dir = a1.a - Math.PI / 2 + l.side * (1.0 + l.off);
    dir += Math.sin(t * 0.0014 + l.seg * 0.8 + l.f * 3) * 0.06 * S.breath * RM;
    if (S.M.wind) dir += 0.12 * (0.6 + 0.4 * Math.sin(t * 0.0009 + l.seed * 4)) * RM;
    if (S.stage === 'mature' && S.mouse.on) {
      const target = Math.atan2(S.mouse.y - y, S.mouse.x - x);
      const infl = clamp(1 - Math.hypot(S.mouse.x - x, S.mouse.y - y) / (340 * k), 0, 1);
      const want = clamp(wrap(target - dir), -0.75, 0.75) * infl;
      l.turn += (want - l.turn) * 0.06;
    } else l.turn *= 0.95;
    return { x, y, dir: dir + l.turn };
  }

  const snapAtSafe = () => S.flower ? snapAt() : 110;

  // Stretch guide: a dotted track rises from the tip to how far this stage still has to be pulled,
  // with chevrons flowing up along it. Shown whenever the plant is waiting to be stretched.
  function drawStretchGuide(now) {
    if (S.guide < 0.01) return;
    const top = S.pts[S.pts.length - 1];
    if (!top) return;
    const A = S.auto;
    const left = A ? Math.max(0.6, A.n - A.prog) : (S.step >= STEPS.length ? 3 : 4);
    const len = clamp(left * stepLen(), 40, Math.max(60, top.y - 70));
    const x = top.x, y0 = top.y - 16, y1 = y0 - len;
    const a = S.guide;
    ctx.save();
    ctx.lineCap = 'round';
    // track
    ctx.setLineDash([1.5, 6]);
    ctx.lineDashOffset = reduce ? 0 : now * 0.02;
    ctx.strokeStyle = `rgba(232,227,212,${0.28 * a})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    ctx.setLineDash([]);
    // where this stage ends
    ctx.strokeStyle = `rgba(232,227,212,${0.45 * a})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x - 7, y1); ctx.lineTo(x + 7, y1); ctx.stroke();
    // chevrons travel up the track and fade out near the end
    const n = 3, cyc = 1.6;
    for (let i = 0; i < n; i++) {
      const u = reduce ? (i + 0.5) / n : ((now / 1000 / cyc) + i / n) % 1;
      const y = y0 - u * (len - 10);
      const fade = Math.sin(Math.PI * u);
      const w = 7 + 2 * fade;
      ctx.strokeStyle = `rgba(232,227,212,${(reduce ? 0.6 : 0.85 * fade) * a})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - w, y + w * 0.6); ctx.lineTo(x, y); ctx.lineTo(x + w, y + w * 0.6); ctx.stroke();
    }
    ctx.restore();
  }
  // ring and ticks where the stem snapped
  function drawBurst(now) {
    const b = S.burst;
    if (!b) return;
    const e = (now - b.t0) / 380;
    if (e >= 1) { S.burst = null; return; }
    const q = 1 - Math.pow(1 - e, 3), sc = 1.5 * k;
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.strokeStyle = `rgba(232,227,212,${0.6 * (1 - e)})`; ctx.lineWidth = 1.8 * (1 - e) + 0.3;
    ctx.beginPath(); ctx.arc(0, 0, (4 + 20 * q) * sc, 0, Math.PI * 2); ctx.stroke();
    if (!reduce) {
      ctx.strokeStyle = `rgba(232,227,212,${1 - e})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const a = (i * 60 + 30) * Math.PI / 180, r1 = (8 + 13 * q) * sc, r2 = r1 + 6 * (1 - e) * sc;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawLeaf(l, pts, t) {
    const pose = leafPose(l, pts, t);
    if (!pose) return;
    const breathe = 1 + Math.sin(t * 0.0016 + l.seg) * 0.035 * S.breath * RM;
    const L = l.size * ease(l.g) * breathe * Math.max(0.75, S.scale);
    if (L < 0.5) return;
    ctx.save(); ctx.translate(pose.x, pose.y); ctx.rotate(pose.dir);
    if (l.kind === 'curl') {
      ctx.strokeStyle = S.M.vine ? 'rgba(150,190,90,0.9)' : 'rgba(170,200,110,0.8)';
      ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i <= 30; i++) {
        const u = i / 30, ang = u * Math.PI * 3.2 * l.side, r = L * (1 - u) * 0.5;
        const px = u * L * 0.9 + Math.cos(ang) * r * 0.3, py = Math.sin(ang) * r * 0.5;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke(); ctx.restore(); return;
    }
    const stalk = L * 0.12, w = L * l.wr, col = leafColor(l.h, l.s, l.l);
    if (S.M.moon) { ctx.shadowColor = 'rgba(200,215,245,0.45)'; ctx.shadowBlur = 8; }
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(stalk, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(stalk, 0);
    ctx.quadraticCurveTo(stalk + L * 0.45, -w, stalk + L, 0);
    ctx.quadraticCurveTo(stalk + L * 0.45, w, stalk, 0);
    ctx.fillStyle = col; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(16,19,15,0.35)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(stalk + L * 0.08, 0); ctx.lineTo(stalk + L * 0.85, 0); ctx.stroke();
    if (S.M.drops && l.seed < 0.5 && L > 6) {
      ctx.fillStyle = 'rgba(170,210,240,0.75)';
      ctx.beginPath(); ctx.arc(stalk + L * 0.9, w * 0.25 + 1.5, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    if (S.M.frost && l.seed < 0.6 && L > 6) {
      ctx.strokeStyle = 'rgba(230,245,255,0.85)'; ctx.lineWidth = 0.8;
      const fx = stalk + L * 0.55, fy = -w * 0.25, r = 2.2;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; ctx.moveTo(fx - Math.cos(a) * r, fy - Math.sin(a) * r); ctx.lineTo(fx + Math.cos(a) * r, fy + Math.sin(a) * r); }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFlower(pose, t) {
    const f = S.flower, b = ease(f.bloom);
    ctx.save(); ctx.translate(pose.x, pose.y); ctx.rotate(pose.a); ctx.scale(pose.s, pose.s);
    if (pose.stub) {
      // the short piece of stem that came off with it, plus one small leaf
      ctx.lineCap = 'round';
      ctx.strokeStyle = leafColor(94, 36, 38); ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2 * k, 12 * k, -1 * k, 24 * k); ctx.stroke();
      ctx.save(); ctx.translate(1 * k, 13 * k); ctx.rotate(-0.5);
      ctx.fillStyle = leafColor(102, 34, 42);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(5 * k, -4 * k, 11 * k, 0); ctx.quadraticCurveTo(5 * k, 4 * k, 0, 0); ctx.fill();
      ctx.restore();
    }
    if (f.glow) { ctx.shadowColor = 'rgba(210,225,255,0.7)'; ctx.shadowBlur = 16; }
    if (f.bud) {
      const L = 15 * k * b, o = f.open;
      ctx.save(); ctx.rotate(-Math.PI / 2);
      [-1, 1].forEach(s => {
        ctx.fillStyle = leafColor(100, 34, 40);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(L * 0.3, s * L * 0.42, L * 0.62, s * L * 0.12);
        ctx.quadraticCurveTo(L * 0.3, s * L * 0.05, 0, 0); ctx.fill();
      });
      [-1, 0, 1].forEach(i => {
        ctx.save(); ctx.rotate(i * o * 0.7);
        ctx.fillStyle = f.col; ctx.globalAlpha = i === 0 ? 1 : 0.88;
        ctx.beginPath(); ctx.moveTo(L * 0.1, 0);
        ctx.quadraticCurveTo(L * 0.5, -L * 0.34, L, 0);
        ctx.quadraticCurveTo(L * 0.5, L * 0.34, L * 0.1, 0); ctx.fill();
        ctx.restore();
      });
      ctx.restore(); ctx.restore(); return;
    }
    ctx.strokeStyle = leafColor(92, 38, 40); ctx.lineWidth = 2 * k;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -8 * k * b); ctx.stroke();
    ctx.translate(0, -8 * k * b);
    ctx.rotate(t * 0.00005 * (reduce ? 0 : 1) * (f.ratio > 0.5 ? 3 : 1));
    ctx.scale(1, 0.86);
    const open = f.open, r0 = 3 * k;
    const rings = Math.max(...f.petals.map(p => p.ring));
    for (let r = 0; r <= rings; r++) {
      f.petals.filter(p => p.ring === r).forEach(p => {
        const len = p.len * b * (0.3 + 0.7 * open), w = len * p.w * (0.6 + 0.4 * open), tip = 1 - p.point * 0.85;
        ctx.save(); ctx.rotate(p.a);
        petalPath(ctx, p, r0, len, w, tip);
        ctx.fillStyle = p.col; ctx.fill();
        ctx.strokeStyle = 'rgba(16,19,15,0.22)'; ctx.lineWidth = 0.7; ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(16,19,15,0.14)'; petalVein(ctx, p, r0, len, 0.6);
        if (f.glow) ctx.shadowBlur = 16;
        ctx.restore();
      });
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = f.center;
    ctx.beginPath(); ctx.arc(0, 0, (4 + f.ratio * 3) * k * b, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f.dot;
    f.dots.forEach(d => {
      ctx.beginPath();
      ctx.arc(Math.cos(d.a) * d.r * b * (0.5 + open * 0.5), Math.sin(d.a) * d.r * b * (0.5 + open * 0.5), d.s, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawBee(pts, t, fp) {
    if (!S.M.bee || pts.length < 2) return;
    const top = fp || pts[pts.length - 1];
    const a = t * 0.0012 * (reduce ? 0.3 : 1);
    const R = (S.flower ? 46 : 34) * k * (fp ? Math.max(1, fp.s * 0.75) : 1);
    const x = top.x + Math.cos(a) * R, y = top.y - 10 * k + Math.sin(a * 1.7) * R * 0.45;
    const dir = Math.sin(a) < 0 ? 1 : -1;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    const flap = Math.sin(t * 0.06) * 0.5 + 0.5;
    ctx.fillStyle = 'rgba(230,235,245,0.55)';
    ctx.beginPath(); ctx.ellipse(-1, -4 - flap * 1.5, 3.2, 2 + flap, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8b63c';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a2116';
    ctx.fillRect(-1.5, -3.2, 1.4, 6.4); ctx.fillRect(1.6, -3, 1.2, 6);
    ctx.restore();
  }

  function drawParts(t) {
    S.parts.forEach(p => {
      if (p.type === 'fly') {
        const x = p.x + Math.sin(t * 0.0006 * p.sp + p.ph) * 30, y = p.y + Math.cos(t * 0.0008 * p.sp + p.ph) * 18;
        const a = 0.35 + 0.35 * Math.sin(t * 0.003 + p.ph);
        ctx.fillStyle = `rgba(220,235,190,${a * S.sky.moon})`;
        ctx.shadowColor = 'rgba(220,235,190,0.9)'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      } else if (p.type === 'petal') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.ellipse(0, 0, 4 * k, 2 * k, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      }
    });
  }

  function drawRhythm(now) {
    const w = rc.width / dpr, h = 26;
    rctx.clearRect(0, 0, w, h);
    rctx.strokeStyle = C.soil; rctx.lineWidth = 1;
    rctx.beginPath(); rctx.moveTo(0, h - 4); rctx.lineTo(w, h - 4); rctx.stroke();
    const span = 10000;
    S.marks = S.marks.filter(m => now - m.t < span);
    S.marks.forEach(m => {
      const x = w - ((now - m.t) / span) * w, age = (now - m.t) / span;
      const ht = m.kind === 'fast' ? 18 : m.kind === 'slow' ? 9 : 13;
      rctx.globalAlpha = 1 - age * 0.8;
      rctx.strokeStyle = m.kind === 'fast' ? C.warm : m.kind === 'slow' ? C.cool : C.paper;
      rctx.lineWidth = 2;
      rctx.beginPath(); rctx.moveTo(x, h - 4); rctx.lineTo(x, h - 4 - ht); rctx.stroke();
    });
    rctx.globalAlpha = 1;
  }

  function frame(now) {
    update(now);
    ctx.clearRect(0, 0, W, H);
    drawSky(now);
    drawGround();
    drawRoots();
    const pts = computePts(now), fine = catmull(pts);
    drawShrooms(now);
    drawHole(now);
    drawSeed(now);
    drawBranches(now);
    drawStem(pts, fine, now);
    S.leaves.forEach(l => { const s = segOf(l); if (s && s.g > l.f * 0.6) drawLeaf(l, pts, now); });
    const top = pts[pts.length - 1];
    if (S.stage === 'picked') {
      // a pale snapped end where the flower used to be
      ctx.fillStyle = 'rgba(214,226,170,0.9)';
      ctx.beginPath(); ctx.arc(top.x, top.y, 1.8 * k, 0, Math.PI * 2); ctx.fill();
      drawParts(now);
      if (S.dim > 0.01) { ctx.fillStyle = `rgba(16,19,15,${S.dim})`; ctx.fillRect(0, 0, W, H); }
      const pose = pickPose();
      const e = ease(S.pick.prog);
      if (e > 0.05) {
        const R = flowerRadius() * pose.s * 1.9;
        const g = ctx.createRadialGradient(pose.x, pose.y, 0, pose.x, pose.y, R);
        g.addColorStop(0, `rgba(232,227,212,${0.07 * e})`); g.addColorStop(1, 'rgba(232,227,212,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pose.x, pose.y, R, 0, Math.PI * 2); ctx.fill();
      }
      drawFlower(pose, now);
      drawBee(pts, now, pose);
    } else {
      if (S.flower) drawFlower({ x: top.x, y: top.y, a: top.a * 0.6, s: S.fh }, now);
      if (S.stage === 'mature' && now - S.matureAt > 400) {
        // quiet pulse inviting the pick
        const p = (Math.sin(now * 0.003) + 1) / 2;
        ctx.strokeStyle = `rgba(232,227,212,${0.06 + p * 0.12})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(top.x, top.y - 10 * k, (S.flower.bud ? 24 * k : flowerRadius() * S.flower.open + 12) + p * 5, 0, Math.PI * 2); ctx.stroke();
      }
      drawBee(pts, now);
      drawParts(now);
      drawStretchGuide(now);
    }
    drawBurst(now);
    if (TUT) drawTutTarget(pts, now);
    drawRhythm(now);
    // fibrous swish while stretching: louder with pull speed and tension
    const speed = S.st ? clamp(Math.abs(S.st.v) / 600, 0, 1) : 0;
    Sound.stretch(clamp(S.growth / 19, 0, 1), Math.max(0, S.pull.x / k), speed);
    requestAnimationFrame(frame);
  }

  // =====================================================================
  // ARCHIVE — picked flowers are stored per viewer and decay with age
  // =====================================================================
  const archiveEl = $('archive'), gridEl = $('archiveGrid'), countEl = $('archiveCount'), noteEl = $('archiveNote');
  const LS_KEY = 'grow-archive-v1';
  let store = null;      // { kind: 'db' | 'local' | 'memory', ... }
  let records = [];      // newest first
  let lastFocus = null, tick = null;

  // Decay curve: noticeable within minutes (good for a class demo), fully decayed after 7 days.
  const FULL_DECAY_MIN = 7 * 24 * 60;
  function decayOf(t) {
    const mins = Math.max(0, (Date.now() - t) / 60000);
    return clamp(Math.log10(1 + mins) / Math.log10(1 + FULL_DECAY_MIN), 0, 1);
  }
  function stageOf(d) { return d < 0.25 ? 'Fresh' : d < 0.5 ? 'Wilting' : d < 0.9 ? 'Withered' : 'Decayed'; }
  function ageText(t) {
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    const m = s / 60; if (m < 60) return `${Math.floor(m)} min ago`;
    const h = m / 60; if (h < 24) return `${Math.floor(h)} h ago`;
    const d = h / 24; return `${Math.floor(d)} day${Math.floor(d) > 1 ? 's' : ''} ago`;
  }
  const fmtDate = t => new Date(t).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  function readLocal() {
    try { const v = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return null; }
  }
  function writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(records)); return true; } catch (e) { return false; }
  }

  async function initStore() {
    // fallback first so the page works immediately
    const local = readLocal();
    store = local ? { kind: 'local' } : { kind: 'memory' };
    records = local || [];
    renderCount();
    try {
      const db = await window.claude?.use?.('db');
      const user = await window.claude?.use?.('user');
      const uid = user ? await user.id() : null;
      if (!db || !uid) return;
      const col = db.collection('data/users/' + uid);
      store = { kind: 'db', col };
      col.orderBy('pickedAt', 'desc').limit(500).onSnapshot(snap => {
        records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCount();
        if (!archiveEl.hidden) renderArchive();
      }, () => {});
    } catch (e) { /* stay on the browser fallback */ }
  }

  function snapshotFlower(f) {
    const r = v => Math.round(v * 100) / 100;
    if (f.bud) return { bud: true, col: f.col, glow: !!f.glow, kk: r(k) };
    return {
      bud: false, ratio: r(f.ratio), glow: !!f.glow, center: f.center, dot: f.dot, kk: r(k),
      shapes: f.shapes,
      petals: f.petals.map(p => ({ ring: p.ring, shape: p.shape, flip: p.flip, seed: p.seed, a: r(p.a), len: r(p.len), w: r(p.w), point: r(p.point), col: p.col })),
      dots: f.dots.map(d => ({ a: r(d.a), r: r(d.r), s: r(d.s) })),
    };
  }

  async function addToArchive() {
    if (!S.flower || !S.result) return;
    const btn = $('keep');
    btn.disabled = true; btn.textContent = 'Saving…';
    const rec = {
      name: S.result.name, path: S.result.path, skipped: S.result.skipped, note: S.result.note, kind: S.result.kind, petals: S.result.petals || '',
      pickedAt: Date.now(), flower: snapshotFlower(S.flower), v: 1,
    };
    let ok = true;
    if (store.kind === 'db') {
      try { await store.col.add(rec); } catch (e) { ok = false; }
      if (!ok) { store = { kind: 'local' }; ok = true; records.unshift(rec); writeLocal(); }
    } else {
      records.unshift(rec);
      if (store.kind === 'local' && !writeLocal()) store = { kind: 'memory' };
    }
    btn.textContent = ok ? 'In the archive' : 'Could not save';
    if (TUT) tutArchived();
    renderCount();
    const ab = $('openArchive'); ab.classList.add('bump'); setTimeout(() => ab.classList.remove('bump'), 350);
  }

  function renderCount() { countEl.textContent = records.length; }

  function renderArchive() {
    noteEl.textContent = store.kind === 'db' ? 'Saved to your account. Only you can see your archive.'
      : store.kind === 'local' ? 'Saved in this browser only.'
      : 'Storage is unavailable here, so this archive lasts until you close the page.';
    if (!records.length) {
      gridEl.innerHTML = '<div class="empty"><b>No flowers yet.</b>Grow a plant, pick its flower, then choose “Add to archive”.</div>';
      return;
    }
    gridEl.innerHTML = '';
    records.forEach((rec, i) => {
      const d = decayOf(rec.pickedAt);
      const card = document.createElement('article');
      card.className = 'card';
      card.style.setProperty('--d', d.toFixed(3));
      const path = (rec.path && rec.path.length) ? rec.path.join(' → ') + (rec.skipped ? ` (+${rec.skipped} unreached)` : '') : 'No choices made';
      card.innerHTML = `
        <canvas aria-label=""></canvas>
        <div class="body">
          <div class="row"><h3></h3><span class="chip"></span></div>
          <div class="decay" aria-hidden="true"><b></b></div>
          <div class="row"><time></time><span class="age"></span></div>
          <div class="path"></div>
          <p></p>
        </div>`;
      card.querySelector('h3').textContent = rec.name || 'Unnamed flower';
      card.querySelector('.chip').textContent = stageOf(d);
      const tm = card.querySelector('time');
      tm.textContent = fmtDate(rec.pickedAt); tm.dateTime = new Date(rec.pickedAt).toISOString();
      card.querySelector('.age').textContent = ageText(rec.pickedAt);
      card.querySelector('.path').textContent = path;
      card.querySelector('p').textContent = [rec.petals, rec.note].filter(Boolean).join(' ');
      const c = card.querySelector('canvas');
      c.setAttribute('aria-label', `${rec.name}, ${stageOf(d).toLowerCase()}, picked ${ageText(rec.pickedAt)}`);
      gridEl.appendChild(card);
      requestAnimationFrame(() => drawArchived(c, rec, d));
    });
  }

  function refreshDecay() {
    const cards = gridEl.querySelectorAll('.card');
    cards.forEach((card, i) => {
      const rec = records[i]; if (!rec) return;
      const d = decayOf(rec.pickedAt);
      card.style.setProperty('--d', d.toFixed(3));
      card.querySelector('.chip').textContent = stageOf(d);
      card.querySelector('.age').textContent = ageText(rec.pickedAt);
      drawArchived(card.querySelector('canvas'), rec, d);
    });
  }

  // ---- colour helpers for decay ----
  function parseHsl(str) {
    const m = /hsla?\(\s*([-\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%/.exec(str || '');
    return m ? { h: +m[1], s: +m[2], l: +m[3] } : { h: 30, s: 40, l: 60 };
  }
  function rot(c, d, seed) {
    // fade toward a dry, brown-grey; spots get darker
    const target = { h: 28 + seed * 10, s: 22, l: 30 + seed * 8 };
    const e = clamp(d * 1.15, 0, 1);
    let dh = ((target.h - c.h + 540) % 360) - 180;
    return `hsl(${(c.h + dh * e).toFixed(1)},${(c.s + (target.s - c.s) * e).toFixed(1)}%,${(c.l + (target.l - c.l) * e).toFixed(1)}%)`;
  }
  // deterministic per-petal random so a flower decays the same way every time it is drawn
  function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  function drawArchived(c, rec, d) {
    const r = c.getBoundingClientRect();
    if (!r.width) return;
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = r.width * pr; c.height = r.height * pr;
    const g = c.getContext('2d');
    g.setTransform(pr, 0, 0, pr, 0, 0);
    const w = r.width, h = r.height;
    g.clearRect(0, 0, w, h);
    const f = rec.flower;
    const fx = w / 2, fy = h * 0.4;
    const radius = f.bud ? 18 * (f.kk || 1) : Math.max(...f.petals.map(p => p.len)) + 4;
    const sc = (Math.min(w, h) * (f.bud ? 0.2 : 0.3)) / radius;
    const droop = d * 0.9;               // how far the head bends over
    const shrink = 1 - d * 0.28;

    // ground line + fallen bits
    g.strokeStyle = 'rgba(232,227,212,0.08)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(w * 0.12, h * 0.9); g.lineTo(w * 0.88, h * 0.9); g.stroke();

    // stem, bending under its own weight as it dries
    const stemCol = rot({ h: 94, s: 36, l: 38 }, d, 0.3);
    const tipX = fx + Math.sin(droop) * 26, tipY = fy + (1 - Math.cos(droop)) * 18;
    g.strokeStyle = stemCol; g.lineWidth = 2.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(fx - 4, h * 0.86);
    g.quadraticCurveTo(fx + 2, h * 0.62, tipX, tipY); g.stroke();
    // leaf on the stub, curling as it dries
    g.save(); g.translate(fx - 1, h * 0.7); g.rotate(-0.6 + d * 1.3);
    g.fillStyle = rot({ h: 102, s: 34, l: 42 }, d, 0.6);
    const lw = 5 * (1 - d * 0.65);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(10, -lw, 22 * shrink, d * 4); g.quadraticCurveTo(10, lw, 0, 0); g.fill();
    g.restore();

    // fallen petals on the ground
    if (!f.bud) {
      const fallen = f.petals.filter((p, i) => hash(i + 1) < d * 0.8);
      fallen.forEach((p, i) => {
        const x = w * 0.2 + hash(i * 3 + 7) * w * 0.6, y = h * 0.9 - 2 - hash(i * 5 + 2) * 6;
        g.save(); g.translate(x, y); g.rotate(hash(i + 9) * 3);
        g.fillStyle = rot(parseHsl(p.col), clamp(d + 0.15, 0, 1), hash(i));
        g.globalAlpha = 0.85;
        g.beginPath(); g.ellipse(0, 0, Math.min(10, p.len * sc * 0.18), Math.min(4, p.len * sc * 0.07), 0, 0, Math.PI * 2); g.fill();
        g.restore();
      });
      g.globalAlpha = 1;
    }

    g.save();
    g.translate(tipX, tipY);
    g.rotate(droop * 1.1);
    g.scale(sc * shrink, sc * shrink * (0.86 + d * 0.1));
    if (f.glow && d < 0.6) { g.shadowColor = `rgba(210,225,255,${0.6 * (1 - d / 0.6)})`; g.shadowBlur = 14; }

    if (f.bud) {
      const L = 15 * (f.kk || 1);
      g.rotate(-Math.PI / 2);
      [-1, 1].forEach(s => {
        g.fillStyle = rot({ h: 100, s: 34, l: 40 }, d, 0.4);
        g.beginPath(); g.moveTo(0, 0);
        g.quadraticCurveTo(L * 0.3, s * L * 0.42, L * 0.62, s * L * 0.12);
        g.quadraticCurveTo(L * 0.3, s * L * 0.05, 0, 0); g.fill();
      });
      const bc = parseHsl(f.col);
      [-1, 0, 1].forEach((i, n) => {
        g.save(); g.rotate(i * 0.08 + i * d * 0.15);
        g.fillStyle = rot(bc, d, hash(n + 4));
        const bw = 0.34 * (1 - d * 0.45);
        g.beginPath(); g.moveTo(L * 0.1, 0);
        g.quadraticCurveTo(L * 0.5, -L * bw, L * (1 - d * 0.15), 0);
        g.quadraticCurveTo(L * 0.5, L * bw, L * 0.1, 0); g.fill();
        g.restore();
      });
      g.restore();
      return;
    }

    const r0 = 3 * (f.kk || 1);
    const rings = Math.max(...f.petals.map(p => p.ring));
    for (let ring = 0; ring <= rings; ring++) {
      f.petals.forEach((p, i) => {
        if (p.ring !== ring) return;
        if (hash(i + 1) < d * 0.8) return; // this one has fallen off
        const hs = hash(i + 13);
        const len = p.len * (1 - d * (0.25 + hs * 0.25));
        const wd = len * p.w * (1 - d * 0.55);          // petals shrivel and narrow
        const curl = d * (0.4 + hs * 0.8) * (hs > 0.5 ? 1 : -1);
        g.save();
        // petals sag toward the ground (canvas "down" after the head's own rotation)
        const sag = wrap(Math.PI / 2 - p.a) * d * 0.35;
        g.rotate(p.a + sag);
        g.transform(1, curl * 0.3, 0, 1, 0, 0); // drying petals twist and curl
        const tip = 1 - p.point * 0.85;
        petalPath(g, p, r0, len * (1 - d * 0.1), wd, tip);
        g.fillStyle = rot(parseHsl(p.col), d, hs);
        g.fill();
        g.shadowBlur = 0;
        // dry edges and spots
        if (d > 0.2) {
          g.strokeStyle = `rgba(60,40,22,${0.15 + d * 0.5})`; g.lineWidth = 0.6 / sc; g.stroke();
          if (hs < d) {
            g.fillStyle = `rgba(55,36,20,${0.25 + d * 0.4})`;
            g.beginPath(); g.ellipse(r0 + len * (0.4 + hs * 0.4), 0, len * 0.08, wd * 0.25, 0, 0, Math.PI * 2); g.fill();
          }
        } else {
          g.strokeStyle = 'rgba(16,19,15,0.18)'; g.lineWidth = 0.6 / sc; g.stroke();
        }
        g.restore();
      });
    }
    g.shadowBlur = 0;
    g.fillStyle = rot(parseHsl(f.center || 'hsl(45,80%,55%)'), d, 0.2);
    g.beginPath(); g.arc(0, 0, (4 + (f.ratio || 0) * 3) * (f.kk || 1) * (1 - d * 0.2), 0, Math.PI * 2); g.fill();
    g.fillStyle = d > 0.5 ? 'rgba(40,28,16,0.8)' : (f.dot || 'rgba(60,40,20,0.75)');
    (f.dots || []).forEach((dt, i) => {
      if (hash(i + 50) < d * 0.6) return;
      g.beginPath(); g.arc(Math.cos(dt.a) * dt.r * 0.8, Math.sin(dt.a) * dt.r * 0.8, dt.s, 0, Math.PI * 2); g.fill();
    });
    g.restore();
  }

  function openArchive() {
    lastFocus = document.activeElement;
    archiveEl.hidden = false;
    renderArchive();
    $('closeArchive').focus({ preventScroll: true });
    clearInterval(tick);
    tick = setInterval(refreshDecay, 20000);
  }
  function closeArchive() {
    archiveEl.hidden = true;
    clearInterval(tick);
    (lastFocus && lastFocus.focus ? lastFocus : cv).focus({ preventScroll: true });
  }
  $('openArchive').addEventListener('click', openArchive);
  $('closeArchive').addEventListener('click', closeArchive);
  $('keep').addEventListener('click', addToArchive);
  archiveEl.addEventListener('keydown', e => { if (e.key === 'Escape') closeArchive(); });
  addEventListener('resize', () => { if (!archiveEl.hidden) refreshDecay(); });

  // =====================================================================
  // TUTORIAL — a short guided run through the whole flow.
  // After each choice, one click on the plant grows it to the next stage.
  // =====================================================================
  const tutEl = $('tut'), startBtn = $('startTut');
  const TSTEPS = [
    { id: 'seed',    title: 'Drag the seed into the soil.',    hint: 'Hold the floating seed, bring it right over the hole in the ground, and let go.' },
    { id: 'soil',    title: 'Choose a soil.',                  hint: 'Pick a card at the bottom. Each choice changes how the plant looks.', choice: true },
    { id: 'grow',    title: 'Stretch the plant upward.',       hint: 'Grab the tip and pull up. It grows as you pull, until it needs something new.', next: 'water' },
    { id: 'water',   title: 'Choose how to water it.',         hint: 'Pick a card at the bottom.', choice: true },
    { id: 'grow',    title: 'Stretch it upward again.',        hint: 'Pull slowly and it grows calm and even.', next: 'light' },
    { id: 'light',   title: 'Choose its light.',               hint: 'Pick a card at the bottom.', choice: true },
    { id: 'grow',    title: 'Stretch the plant upward.',       hint: 'Pull sideways a little and it leans with you.', next: 'friend' },
    { id: 'friend',  title: 'Choose a companion.',             hint: 'Pick a card at the bottom.', choice: true },
    { id: 'grow',    title: 'Stretch the plant upward.',       hint: 'Almost there.', next: 'climate' },
    { id: 'climate', title: 'Choose the weather.',             hint: 'This is the last choice before it blooms.', choice: true },
    { id: 'grow',    title: 'Stretch it once more to make it bloom.', hint: 'The flower’s petals and colors come from your choices.', next: 'bloom' },
    { id: 'pick',    title: 'Pull the flower until it snaps.', hint: 'Grab it and pull. The stem resists, then gives. Move your cursor around it first if you like. It reacts to you.' },
    { id: 'archive', title: 'Click “Add to archive”.',         hint: 'Your flower is kept with today’s date.' },
    { id: 'end',     title: 'You know the whole flow.',        hint: 'Free mode works the same way. Stretch it slowly and the plant stays calm and balanced. Yank it fast and you rush it, so it twists.' },
  ];
  const CHOICE_FX = {
    clay:   'Thick roots spread deep, and a sturdy sprout came up.',
    sand:   'A few long, thin roots reach down, and a thin sprout came up.',
    humus:  'Lots of roots spread out, and a sprout came up ready for big leaves.',
    mist:   'The leaves got smaller and folded upward.',
    steady: 'The stem will now grow straight and even.',
    flood:  'The leaves drooped and now hold water drops.',
    sun:    'A sun rose. The colors brightened.',
    moon:   'A moon and fireflies appeared. The leaves began to glow.',
    shade:  'The light comes from one side now, so the plant will lean toward it.',
    bee:    'A bee arrived. The flower will get extra petals.',
    vine:   'A vine wrapped itself around the stem.',
    fungus: 'Purple mushrooms popped up at the base.',
    wind:   'Wind bent the stem. Petals may blow away later.',
    frost:  'Frost formed on the leaves and the colors cooled.',
    warmth: 'The air warmed up. The flower will be bigger and brighter.',
  };

  const tutCur = () => TSTEPS[TUT.i];
  const tutAccepts = () => !!TUT && !TUT.busy;

  function renderTut() {
    if (!TUT) return;
    const st = tutCur(), last = TSTEPS.length - 1;
    $('tutStep').textContent = st.id === 'end' ? 'Tutorial done' : `Step ${TUT.i + 1} of ${last}`;
    $('tutBar').style.width = `${(TUT.i / last) * 100}%`;
    $('tutTitle').textContent = TUT.busy ? TUT.busy : st.title;
    $('tutHint').textContent = TUT.busy ? '' : st.hint;
    const fx = $('tutFxLine');
    fx.hidden = !TUT.fx; fx.textContent = TUT.fx || '';
    $('tutEnd').hidden = st.id !== 'end';
  }
  // finish the current step: say what happened, move on
  function tutAdvance(fx) {
    TUT.busy = null;
    if (fx) TUT.fx = fx;
    TUT.i = Math.min(TUT.i + 1, TSTEPS.length - 1);
    const st = tutCur();
    if (st.choice) openChoice(performance.now());
    if (st.id === 'archive') setTimeout(() => $('keep').focus({ preventScroll: true }), 50);
    if (st.id === 'end') setTimeout(() => $('tutFree').focus({ preventScroll: true }), 50);
    renderTut();
  }

  $('tutExit').addEventListener('click', exitTutorial);
  $('tutFree').addEventListener('click', exitTutorial);
  $('tutArchive').addEventListener('click', openArchive);
  startBtn.addEventListener('click', startTutorial);

  function startTutorial() {
    if (!archiveEl.hidden) closeArchive();
    TUT = { i: 0, fx: '', busy: null };
    document.body.classList.add('tut-on');
    tutEl.hidden = false;
    resize(); reset();
    renderTut();
    cv.focus({ preventScroll: true });
  }
  function exitTutorial() {
    TUT = null;
    document.body.classList.remove('tut-on');
    tutEl.hidden = true;
    resize(); reset();
    cv.focus({ preventScroll: true });
  }

  function tutAct(x, y, now) {
    const st = tutCur();
    // growing and picking are drags (see the input handlers); a click only nudges the plant
    if (TUT.busy) return;
    if ((S.stage === 'growing' || S.stage === 'mature') && nearPlant(x, y)) S.kick = 0.6;
  }

  // a stretched stage has finished growing: bloom, or move on to the next choice
  function tutGrowDone(next) {
    if (!TUT) return;
    if (next === 'bloom') { TUT.busy = 'A flower is opening…'; renderTut(); startFlower(performance.now(), false); }
    else tutAdvance(performance.now() - S.rushAt < 4000 ? 'You yanked it, so it grew twisted, with small crowded leaves.' : 'It grew taller, with new branches and leaves.');
  }
  function tutChoice(st, o) {
    if (tutCur().id !== st.key) return;
    if (st.key === 'soil') { TUT.busy = 'Planting…'; TUT.pendingFx = CHOICE_FX[o.id]; renderTut(); return; }
    tutAdvance(`${o.en}: ${CHOICE_FX[o.id] || o.hint}`);
  }
  function tutSprouted() {
    if (!TUT || tutCur().id !== 'soil' || !TUT.pendingFx) return;
    const fx = TUT.pendingFx; TUT.pendingFx = null;
    tutAdvance(fx);
  }
  function tutTick() {}
  function tutPlanted() {
    if (!TUT || tutCur().id !== 'seed') return;
    tutAdvance('The seed dropped into the ground. Now choose what soil it grows in.');
  }
  function tutBloomed() {
    if (!TUT || tutCur().id !== 'grow') return;
    const f = S.flower;
    tutAdvance(`It bloomed: ${SHAPE_NAME[f.shapes[0]]} outer petals and ${SHAPE_NAME[f.shapes[1]]} inner petals, shaped by your choices.`);
  }
  function tutPicked() {
    if (!TUT || tutCur().id !== 'pick') return;
    tutAdvance('The stem snapped and you picked it. The message below sums up how it grew.');
  }
  function tutArchived() {
    if (!TUT || tutCur().id !== 'archive') return;
    tutAdvance('It’s in your archive now. The longer it stays there, the more it decays.');
  }

  // a dashed ring marks where to click
  function drawTutTarget(pts, now) {
    if (TUT.busy) return;
    const st = tutCur();
    const top = pts[pts.length - 1];
    let x, y, r;
    if (st.id === 'seed' && S.stage === 'seed' && (S.sd.mode === 'air' || S.sd.mode === 'fly')) { const sp = seedPos(now); x = sp.x; y = sp.y; r = 30; }
    else if (st.id === 'grow' && S.stage === 'growing' && top) { x = top.x; y = top.y; r = 30; }
    else if (st.id === 'pick' && S.stage === 'mature' && top) { x = top.x; y = top.y - 10 * k; r = (S.flower.bud ? 24 * k : flowerRadius() * S.flower.open + 14); }
    else return;
    const p = (Math.sin(now * 0.005) + 1) / 2;
    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.lineDashOffset = -now * 0.02;
    ctx.strokeStyle = `rgba(147,180,198,${0.45 + p * 0.45})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r + p * 4, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // the tutorial button only shows before a free-mode plant has started
  setInterval(() => { const hide = !!TUT || S.stage !== 'seed'; if (startBtn.hidden !== hide) startBtn.hidden = hide; }, 300);

  reset();
  initStore();
  requestAnimationFrame(frame);
})();
</script>
